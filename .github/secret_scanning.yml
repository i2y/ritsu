# The paths GitHub's secret scanning leaves alone (DESIGN 16.10). Each holds, on purpose, the one
# fake Google API key the W901 checks are tested with: the materials that make each language's
# W901 fire, the code lists and golden outputs that show those materials, the skills that copy the
# code lists, and the playground's module, whose ledgers carry the same value. The key is
# "AIzaSyD-ritsu-fake-key-for-tests-" and six zeros; the source code writes it in two parts, and
# no other value of a key's shape is in the repository.
paths-ignore:
  - "crates/*/tests/**/W901_*"
  - "crates/*/tests/**/W901_*/**"
  - "crates/*/docs/codes.md"
  - "crates/*/docs/codes.ja.md"
  - "crates/geas/tests/golden/*/explain/all.txt"
  - "skills/*/codes.md"
  - "website/docs/playground/ritsu.wasm"
