name: platforms

# The tests of the platforms level (DESIGN 10.2, 10.5, 10.6): the workflows dandori writes,
# run on the platforms themselves (Temporal's dev server, Argo Workflows on a kind cluster,
# Step Functions on LocalStack) and compared with its reference interpreter; the books of chobo
# on a TiDB cluster (TiUP's playground) and on Vitess, as on MySQL; and the tests that ask a
# server outside: e-Gov and the eCFR for the base layer, koyomi and yuen, and the Buf Schema
# Registry for rulec. Nightly, by hand, and on a pull request that changes dandori.
#
# The tests of the tools level are tools.yml's: the steps here run only the tests that need a
# platform, one at a time, as on the machine where they were written; the runner is this job's
# alone, so nothing else runs beside them. A test that fails is run once more, and says so in
# the log; a second failure is a failure, not a wobble (DESIGN 10.6).

on:
  pull_request:
    paths: ["crates/dandori/**"]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a second would only queue behind the first's cluster.
concurrency:
  group: platforms
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BUF_VERSION: "1.54.0"
  # The Jev tasks are never sent to TypeSafe from CI: every call is paid for, and how often CI
  # runs cannot be foreseen, so the key is not kept here, not even as a secret. Empty, the test
  # says SKIP, which ci/skips/platforms.txt allows (DESIGN 10.5).
  TYPESAFE_API_KEY: ""
  # Nor are the tasks of OpenAI's Decisions API sent to OpenAI, for the same reason.
  OPENAI_API_KEY: ""

jobs:
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-platforms-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-platforms-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # dandori's tools/temporal-go/go.mod asks Go 1.26
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: uv
        uses: astral-sh/setup-uv@v10.0.1

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}

      # --- dandori: the SDKs and runners under tools/, as tools.yml installs them.
      - name: "dandori: the Node packages under tools/"
        run: |
          set -eu
          for d in tools tools/temporal tools/durable tools/agents tools/wire tools/mermaid; do
            npm ci --prefix "crates/dandori/$d"
          done

      - name: "dandori: the Python environments under tools/"
        run: |
          set -eu
          for d in temporal-python pydantic-graph agents wire connect; do
            uv venv --python 3.13 "crates/dandori/tools/$d/.venv"
            uv pip install --python "crates/dandori/tools/$d/.venv/bin/python" -r "crates/dandori/tools/$d/requirements.txt"
          done

      - name: "dandori: the Go modules of tools/temporal-go"
        run: cd crates/dandori/tools/temporal-go && go mod download

      # --- The platforms. Argo: kind 0.33 (for the node image tools/argo/setup.sh pins; built
      # by Go, whose checksum database holds the module to its release), the argo CLI held to
      # its release's checksum, and the cluster setup.sh makes. LocalStack: its image, which the
      # runner starts per test. Temporal: the dev server, which the SDK's test kit fetches.
      - name: kind and the argo CLI
        run: |
          set -eu
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          d="$RUNNER_TEMP/argo"
          mkdir -p "$d"
          curl -fsSL -o "$d/argo.gz" https://github.com/argoproj/argo-workflows/releases/download/v4.1.4/argo-linux-amd64.gz
          echo "2c8ef41d53593f2ee64d85fb69b631c89a0fc2c57e6ce011422caa525a97ec58  $d/argo.gz" | sha256sum -c -
          gunzip "$d/argo.gz"
          chmod +x "$d/argo"
          echo "$d" >> "$GITHUB_PATH"

      - name: Argo Workflows on a kind cluster
        run: |
          set -eu
          kind version
          argo version --short
          sh crates/dandori/tools/argo/setup.sh

      - name: The LocalStack image
        run: docker pull -q localstack/localstack:4.14.0

      # --- chobo: the MySQL family on TiDB (chobo's DESIGN 4.5). TiUP v1.17.1, held to its
      # release's checksum, with the root.json the mirror's install script puts beside it (version
      # 2, held to the checksum taken when this was written; TiUP checks the roots that follow it,
      # and the components against them), runs the playground of TiDB 8.5.8: one TiDB, TiKV and PD.
      # MySQL 8.4's client loads the tables there, and its server is the one the same tests start
      # for MySQL.
      - name: "chobo: the runners, MySQL 8.4 and TiDB 8.5.8 on TiUP's playground"
        run: |
          set -eu
          npm ci --prefix crates/chobo/tools/runner
          uv venv --python 3.13 crates/chobo/tools/runner/.venv
          uv pip install --python crates/chobo/tools/runner/.venv/bin/python --require-hashes -r crates/chobo/tools/runner/requirements.txt
          sudo apt-get install -y -q libaio1t64 libnuma1
          [ -e /usr/lib/x86_64-linux-gnu/libaio.so.1 ] || sudo ln -s /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          sh crates/chobo/tools/mysql/fetch.sh
          echo "RITSU_MYSQL_BIN=$GITHUB_WORKSPACE/crates/chobo/tools/mysql/mysql/bin" >> "$GITHUB_ENV"
          export TIUP_HOME="$RUNNER_TEMP/tiup"
          mkdir -p "$TIUP_HOME/bin"
          curl -fsSL -o "$RUNNER_TEMP/tiup.tar.gz" https://tiup-mirrors.pingcap.com/tiup-v1.17.1-linux-amd64.tar.gz
          echo "1dda2543e8d8ef98f69f76981982ff1176e09276d7df26bcd63a198287d6a945  $RUNNER_TEMP/tiup.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tiup.tar.gz" -C "$TIUP_HOME/bin"
          curl -fsSL -o "$TIUP_HOME/bin/root.json" https://tiup-mirrors.pingcap.com/root.json
          echo "032201888f247db943a3ab5b84ecb5e6dbd1d77c6b9adc9657b01175cdb534bf  $TIUP_HOME/bin/root.json" | sha256sum -c -
          nohup "$TIUP_HOME/bin/tiup" playground v8.5.8 --tag chobo --tiflash 0 --without-monitor --host 127.0.0.1 --db.port 4000 > "$RUNNER_TEMP/tidb.log" 2>&1 &
          mysql="crates/chobo/tools/mysql/mysql/bin/mysql --no-defaults -h 127.0.0.1 -P 4000 -u root"
          for i in $(seq 1 150); do
            if $mysql -e 'select 1' > /dev/null 2>&1; then break; fi
            sleep 2
          done
          $mysql -e 'select tidb_version()\G' || { cat "$RUNNER_TEMP/tidb.log"; exit 1; }
          echo "RITSU_TIDB=127.0.0.1:4000" >> "$GITHUB_ENV"

      # --- chobo: the MySQL family on Vitess (chobo's DESIGN 4.5). vttestserver, vtcombo and
      # mysqlctl, built from the source of Vitess v24.0.5: the tag alone is cloned, and held to the
      # commit it was when this was written. The tests start a throwaway vttestserver of their own,
      # with the MySQL 8.4 of the step above under it (RITSU_MYSQL_BIN).
      - name: "chobo: Vitess v24.0.5, built from its source"
        env:
          GOTOOLCHAIN: auto
        run: |
          set -eu
          git clone -q --depth 1 --branch v24.0.5 https://github.com/vitessio/vitess.git "$RUNNER_TEMP/vitess"
          cd "$RUNNER_TEMP/vitess"
          test "$(git rev-parse HEAD)" = 9b28c872ea20bfbe9d5ab89621473910157aa772
          go build -trimpath -o bin/ ./go/cmd/vttestserver ./go/cmd/vtcombo ./go/cmd/mysqlctl
          bin/vtcombo --version
          echo "RITSU_VITESS_BIN=$RUNNER_TEMP/vitess/bin" >> "$GITHUB_ENV"

      - name: Copy in the pages the sites share
        run: |
          website/rulec/sync.sh
          website/dandori/sync.sh

      - name: Build
        run: cargo build --workspace --locked

      - name: "dandori: the platforms, one test at a time"
        run: |
          set -u
          failed=0
          for t in \
            localstack_runs_as_the_reference_says \
            temporal_runs_as_the_reference_says \
            temporal_python_runs_as_the_reference_says \
            temporal_go_runs_as_the_reference_says \
            temporal_activities_run_in_the_other_language \
            temporal_worker_versioning_keeps_a_run_on_its_build \
            temporal_runs_a_flow_as_its_child \
            argo_runs_as_the_reference_says \
            open_responses_agents_answer_on_ollama \
            jev_tasks_answer_on_typesafe \
            decision_tasks_answer_on_ollama \
            decision_tasks_answer_on_openai
          do
            echo "::group::$t"
            if ! cargo xtask test --level platforms -p dandori -- --exact "$t"; then
              echo "::warning::$t failed once; it runs once more (DESIGN 10.6)"
              if ! cargo xtask test --level platforms -p dandori -- --exact "$t"; then
                echo "::error::$t failed twice"
                failed=1
              fi
            fi
            echo "::endgroup::"
          done
          if kubectl --context kind-dandori -n argo get workflows --no-headers 2>/dev/null | grep -q .; then
            echo "::error::workflows were left on the kind cluster"
            kubectl --context kind-dandori -n argo get workflows
            failed=1
          fi
          exit $failed

      - name: "chobo: the MySQL family on MySQL, TiDB and Vitess, one test at a time"
        run: |
          set -u
          failed=0
          for pt in \
            chobo:every_scenario_matches_on_the_mysql_family \
            chobo:what_only_the_mysql_family_has \
            chobo:what_only_the_mysql_family_has_in_japanese \
            ritsu-testkit:the_databases_made_on_a_server_of_the_machines_are_dropped_with_the_value \
            ritsu-testkit:a_vitess_is_started_and_stopped
          do
            p="${pt%%:*}"
            t="${pt#*:}"
            echo "::group::$p $t"
            if ! cargo xtask test --level platforms -p "$p" -- --exact "$t"; then
              echo "::warning::$t failed once; it runs once more (DESIGN 10.6)"
              if ! cargo xtask test --level platforms -p "$p" -- --exact "$t"; then
                echo "::error::$t failed twice"
                failed=1
              fi
            fi
            echo "::endgroup::"
          done
          exit $failed

      # --- The servers outside. rulec's test fetches a dependency of a contract from the Buf
      # Schema Registry and serves the rule as a Connect service with it.
      - name: "rulec: the Connect runtime and the plugins that write its stubs"
        run: python3 -m pip install --upgrade connectrpc protoc-gen-connectrpc protoc-gen-py uvicorn

      - name: e-Gov, the eCFR and the Buf Schema Registry, asked for real
        run: |
          set -eu
          cargo xtask test --level platforms -p ritsu-base -p koyomi -p yuen -- the_real_
          cargo xtask test --level platforms -p rulec -- 依存のある契約のサービスが立つ
