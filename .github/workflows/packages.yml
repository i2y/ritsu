name: packages

# What a release hands out, built and tried on every push (DESIGN 13.2), so that a release is not
# the first time it runs: the musl binary of ritsu, the archive with its nine links (unpacked, and
# run under all ten names), and the .deb and the .rpm (each installed on Debian and on Fedora,
# run, and removed). release.yml does the same on the four platforms, on a tag. The action a
# workflow installs a release with runs here too, on the newest release.

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-packages-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-packages-${{ runner.os }}-

      - name: musl linker
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p ritsu

      - name: The archive unpacks, and every name reads its example
        run: |
          set -eu
          bin=target/x86_64-unknown-linux-musl/release/ritsu
          sh packaging/archive.sh "v$("$bin" --version | cut -d' ' -f2)" x86_64-unknown-linux-musl "$bin" "$RUNNER_TEMP/dist"
          d=$(mktemp -d)
          tar -xzf "$RUNNER_TEMP"/dist/ritsu-v*-x86_64-unknown-linux-musl.tar.gz -C "$d"
          ls -l "$d"
          sh packaging/smoke.sh "$d" crates

      - name: The .deb and the .rpm install, run and uninstall
        run: |
          set -eu
          bin=target/x86_64-unknown-linux-musl/release/ritsu
          sh packaging/linux.sh "$("$bin" --version | cut -d' ' -f2)" x86_64-unknown-linux-musl "$bin" "$RUNNER_TEMP/dist"

  # The action as a workflow uses it (DESIGN 13.2), on the newest release, as a ref of this
  # repository is not a release: what it puts on the PATH runs, and a list of a repository of its
  # own has its signature checked and its pages written, with no credentials (DESIGN 17.17). The
  # module is one of this repository's, on ghcr.io.
  action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The newest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - uses: ./
        with:
          version: ${{ steps.release.outputs.tag }}
          cosign: true

      - name: What the action put on the PATH
        run: |
          ritsu --version
          rulec --version
          cosign version

      - name: A list of a repository of its own
        working-directory: ${{ runner.temp }}
        run: |
          cat > modules.list <<'EOF'
          module "ghcr.io/i2y/ritsu-holidays"
          signature "ghcr.io/i2y/" by matching "^https://github[.]com/i2y/ritsu/" issuer "https://token.actions.githubusercontent.com"
          EOF
          ritsu mod site modules.list --out site
          test -f site/index.html
