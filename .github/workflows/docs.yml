name: docs

# Build ritsu's site and deploy it to GitHub Pages as one artifact (DESIGN 13.2): ritsu's own pages
# and the site of each language below them, each in English and Japanese.
#
#   website/docs/              -> https://i2y.github.io/ritsu/
#   website/docs-ja/           -> https://i2y.github.io/ritsu/ja/
#   website/rulec/docs/        -> https://i2y.github.io/ritsu/rulec/
#   website/rulec/docs-ja/     -> https://i2y.github.io/ritsu/rulec/ja/
#   website/dandori/docs/      -> https://i2y.github.io/ritsu/dandori/
#   website/dandori/docs-ja/   -> https://i2y.github.io/ritsu/dandori/ja/
#   website/chobo/docs/        -> https://i2y.github.io/ritsu/chobo/
#   website/chobo/docs-ja/     -> https://i2y.github.io/ritsu/chobo/ja/
#
# It runs on a push to main that changes what the site is built from (website/, the documents
# rulec's and chobo's sync.sh copy in, and this file), and by hand from the Actions tab. Pages takes
# its source from "GitHub Actions" in the repository's settings. crates/ritsu/tests/website.rs
# holds this file to those triggers.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "crates/rulec/AGENTS.md"
      - "crates/rulec/docs/**"
      - "crates/chobo/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      # build.sh builds ritsu's pages in both languages, then each language's site with its own
      # build.sh, and copies it to build/<language>. Nothing but Zensical is needed: the pictures,
      # the pages `dandori doc` and `chobo doc` write for the examples and the playground's module
      # and projects are committed, rulec's and chobo's sync.sh copy their documents in from
      # crates/rulec and crates/chobo, and the lexers that colour the code are plain Python:
      # website/tools/knlexer.py, and rulec's tools/rulelexer.py, dandori's tools/flowlexer.py and
      # chobo's tools/booklexer.py, which ritsu's pages use too. The tests of each language (rulec's
      # tests/website.rs and tests/docs.rs, dandori's and chobo's tests/docs.rs and tests/doc.rs,
      # kaname's tests/docs.rs) and ritsu's tests/website.rs and tests/playground.rs hold the pages
      # and the lexers to the tools; the other workflows run them.
      - name: Build the site
        run: |
          cd website
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python zensical
          ./build.sh

      # The playgrounds rulec's and dandori's sites had are ritsu's now: their pages are kept only to
      # send a link on to it.
      - name: Check the tree is complete
        run: |
          test -f website/build/index.html
          test -f website/build/ja/index.html
          test -f website/build/playground/index.html
          test -f website/build/playground/ritsu.wasm
          test -f website/build/ja/playground/projects.json
          test -f website/build/rulec/index.html
          test -f website/build/rulec/ja/index.html
          test -f website/build/rulec/codes/index.html
          test -f website/build/rulec/ja/codes/index.html
          test -f website/build/rulec/playground/index.html
          test -f website/build/rulec/ja/playground/index.html
          test -f website/build/dandori/index.html
          test -f website/build/dandori/ja/index.html
          test -f website/build/dandori/reference/codes/index.html
          test -f website/build/dandori/ja/reference/codes/index.html
          test -f website/build/dandori/doc/hotel.html
          test -f website/build/dandori/ja/doc/hotel.html
          test -f website/build/dandori/playground/index.html
          test -f website/build/dandori/ja/playground/index.html
          test -f website/build/chobo/index.html
          test -f website/build/chobo/ja/index.html
          test -f website/build/chobo/codes/index.html
          test -f website/build/chobo/ja/codes/index.html
          test -f website/build/chobo/doc/refunds.html
          test -f website/build/chobo/ja/doc/refunds.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
