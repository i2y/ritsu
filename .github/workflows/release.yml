name: release

# A tag `v*` builds `ritsu` once per platform (static on Linux; on macOS linked only to the system
# library), puts it in an archive with a link to it for each of the eight languages, the two
# licenses and THIRD_PARTY_NOTICES, checks that the tag is the version every one of the nine names
# says, and publishes the archives with their SHA-256 sums as a GitHub Release (DESIGN 13.2).
# `action.yml` at the root of the repository installs one of them onto a runner, and the install
# page says which lines to run by hand. Before anything is built, audit.yml looks up every
# dependency's known vulnerabilities (DESIGN 3.6).
#
# The same binaries reach the package managers. The Linux ones go out as a .deb and an .rpm as well,
# beside the archives and in the same SHA256SUMS. Once the release is up, the Homebrew formula is
# written from that SHA256SUMS, audited, installed and tested by brew on macOS and on Linux, and
# only then pushed to the tap. crates.io is not a destination (DESIGN 13.2).
#
#   ritsu-v0.23.0-x86_64-unknown-linux-musl.tar.gz
#   ritsu-v0.23.0-aarch64-unknown-linux-musl.tar.gz
#   ritsu-v0.23.0-x86_64-apple-darwin.tar.gz
#   ritsu-v0.23.0-aarch64-apple-darwin.tar.gz
#   ritsu_0.23.0-1_amd64.deb      ritsu-0.23.0-1.x86_64.rpm
#   ritsu_0.23.0-1_arm64.deb      ritsu-0.23.0-1.aarch64.rpm
#   ritsu-skills-v0.23.0.zip
#   SHA256SUMS
#
# An archive holds `ritsu` and, beside it, `rulec`, `dandori`, `koyomi`, `chobo`, `geas`, `yuen`,
# `sakai` and `sekisho`, links to it, LICENSE-MIT and LICENSE-APACHE, and THIRD_PARTY_NOTICES, the notices and
# licenses of what the binary holds from others (packaging/archive.sh). The .deb and the .rpm put
# the same three files in /usr/share/doc/ritsu, and the formula in the keg. The zip holds the
# nine Agent Skills of skills/, a folder each, and the two licenses (packaging/skills.sh): the same
# files `ritsu skills install` writes, for an agent that is given folders rather than the binary.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing is built while a dependency has a known vulnerability that deny.toml or
  # osv-scanner.toml does not let pass with its reason: the crates the binary is made of, and the
  # versions `ritsu gen` writes into the packages it makes, locked by the tools the tests run
  # (audit.yml, DESIGN 3.6, 13.2).
  audit:
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read

  build:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        # `host` is where cargo runs, for the cargo-auditable that runs there, with the SHA-256 its
        # release gives that archive
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            host: x86_64-unknown-linux-gnu
            auditable_sha256: 4c8d3b08c3c34e9f2333367224dbbfb4aab68067698b43de59fe19aded3416dd
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            auditable_sha256: bcb2d46002a8dd8e94d0d669cb39d38c9651db2ae5d1f3f1f1bab516ee1e212c
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            host: x86_64-apple-darwin
            auditable_sha256: 4b87f06ea13d32466bbc68b1f5715ac11753a052d9935245380bddce8a3f0e50
          - target: aarch64-apple-darwin
            runner: macos-latest
            host: aarch64-apple-darwin
            auditable_sha256: a66ad6392861ca1abfe0b02b522622d91edf63e5d7b60f4d3088b5c23d240c72
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # A release named v0.23.0 that says `rulec 0.22.1` would mislead everyone who runs
      # `--version`, so the tag has to be the version of the workspace (DESIGN 13.1); the binary
      # is held to it again below, under every name.
      - name: The tag is the version of the workspace
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, but the version in Cargo.toml is '$v'"; exit 1; }

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      # The binary carries the list of the crates it is made of, written by cargo-auditable into a
      # section of its own (`.dep-v0`), so that a scanner of what is installed reads which
      # serde_json the ritsu it finds has: `cargo audit bin`, osv-scanner (its rust/cargoauditable
      # plugin), Trivy, Grype and Syft (DESIGN 3.6, 13.2). The release's archive, held to its
      # SHA-256, as tools.yml installs wasm-tools.
      - name: cargo-auditable 0.7.7
        run: |
          set -eu
          d="$RUNNER_TEMP/cargo-auditable"
          mkdir -p "$d"
          curl -fsSL -o "$d/a.tar.xz" "https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.7/cargo-auditable-${{ matrix.host }}.tar.xz"
          echo "${{ matrix.auditable_sha256 }}  $d/a.tar.xz" | shasum -a 256 -c -
          tar -xJf "$d/a.tar.xz" -C "$d" --strip-components=1
          echo "$d" >> "$GITHUB_PATH"

      - name: Build
        run: cargo auditable build --release --locked --target ${{ matrix.target }} -p ritsu

      - name: The binary carries its crates
        run: |
          set -eu
          b=target/${{ matrix.target }}/release/ritsu
          if [ "$RUNNER_OS" = Linux ]; then readelf -S "$b" | grep -q '\.dep-v0'; else otool -l "$b" | grep -q 'sectname \.dep-v0'; fi

      - name: Archive
        run: sh packaging/archive.sh "$GITHUB_REF_NAME" ${{ matrix.target }} target/${{ matrix.target }}/release/ritsu dist

      # Not the test suite — that needs a dozen tools — but the archive has to unpack, every name
      # in it has to say the version of the tag, and each of the eight languages has to read what
      # it is given (packaging/smoke.sh), the four that read others with the others joined.
      - name: The archive unpacks, every name says the version, every language reads its example
        run: |
          set -eu
          d=$(mktemp -d)
          tar -xzf "dist/ritsu-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" -C "$d"
          ls -l "$d"
          for n in ritsu rulec dandori koyomi chobo geas yuen sakai sekisho; do
            test "$("$d/$n" --version)" = "$n ${GITHUB_REF_NAME#v}" || { echo "::error::$n --version says '$("$d/$n" --version)'"; exit 1; }
          done
          sh packaging/smoke.sh "$d" crates

      # The same binary as a .deb and an .rpm, each installed on Debian and on Fedora, run under
      # all eight names and removed again before it is kept.
      - name: The Linux packages
        if: runner.os == 'Linux'
        run: sh packaging/linux.sh "${GITHUB_REF_NAME#v}" ${{ matrix.target }} target/${{ matrix.target }}/release/ritsu dist

      - uses: actions/upload-artifact@v7
        with:
          name: ritsu-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The skills are the same on every platform, so they are zipped once, here, from the tag.
      - name: The skills
        run: |
          set -eu
          sh packaging/skills.sh "$GITHUB_REF_NAME" dist
          unzip -l "dist/ritsu-skills-$GITHUB_REF_NAME.zip"
          for skill in ritsu rulec dandori koyomi chobo geas yuen sakai sekisho; do
            unzip -l "dist/ritsu-skills-$GITHUB_REF_NAME.zip" "$skill/SKILL.md" >/dev/null || { echo "::error::the zip has no $skill/SKILL.md"; exit 1; }
          done

      - name: Checksums
        run: cd dist && sha256sum ritsu-*.tar.gz ritsu_*.deb ritsu-*.rpm ritsu-skills-*.zip | tee SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ritsu $GITHUB_REF_NAME" \
            --notes "One static binary per platform, with a link to it for each of the eight languages (rulec, dandori, koyomi, chobo, geas, yuen, sakai, sekisho); on Linux also as a .deb and an .rpm. The Agent Skills of ritsu and the eight languages are in ritsu-skills-$GITHUB_REF_NAME.zip, a folder each, to unzip where an agent reads skills. Verify a download against SHA256SUMS before running it; the install page says how." \
            dist/ritsu-*.tar.gz dist/ritsu_*.deb dist/ritsu-*.rpm dist/ritsu-skills-*.zip dist/SHA256SUMS

  # The formula is written once, from the SHA256SUMS that was just published, so it points at
  # these very archives; the jobs below test that file and push that file.
  formula:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: The formula, from the published sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          sh packaging/homebrew.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" > ritsu.rb
          cat ritsu.rb

      - uses: actions/upload-artifact@v7
        with:
          name: formula
          path: ritsu.rb
          if-no-files-found: error

  # brew has to take the formula as a user's brew would — audit it, download the archive and
  # hold it to the sum, install it and run the formula's own test — on both systems it
  # serves, before the tap is touched.
  homebrew:
    needs: formula
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: formula

      - name: brew audits, installs and tests it
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # On the Linux runner brew is installed but not on the path.
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git i2y/tap
          cp ritsu.rb "$(brew --repository i2y/tap)/Formula/ritsu.rb"
          brew audit --strict --online --formula i2y/tap/ritsu
          brew install --formula i2y/tap/ritsu
          brew test i2y/tap/ritsu
          for n in ritsu rulec dandori koyomi chobo geas yuen sakai sekisho; do
            test "$("$n" --version)" = "$n ${GITHUB_REF_NAME#v}"
          done

  # The tap is i2y/homebrew-tap, which holds more than ritsu. The key is a deploy key of that
  # repository alone, so this job can write there and nowhere else. It adds the formula `ritsu`
  # and leaves the formula `rulec` as it is: what happens to the people who installed `rulec`
  # from the tap is a step of its own (DESIGN 13.2), made when the author says.
  tap:
    needs: homebrew
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: formula
          path: ${{ runner.temp }}

      - uses: actions/checkout@v7
        with:
          repository: i2y/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}

      - name: Push the formula
        run: |
          set -eu
          mkdir -p Formula
          cp "$RUNNER_TEMP/ritsu.rb" Formula/ritsu.rb
          git add Formula/ritsu.rb
          if git diff --cached --quiet; then echo "the tap already has ritsu $GITHUB_REF_NAME"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Update ritsu to $GITHUB_REF_NAME"
          git push origin HEAD:main
