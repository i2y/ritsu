name: audit

# The known vulnerabilities, licenses and sources of what ritsu depends on (DESIGN 3.6). cargo-deny
# holds the crates of Cargo.lock to the RustSec advisory database, to the licenses of deny.toml and
# to crates.io alone. osv-scanner looks up every lockfile of the repository in OSV: Cargo.lock
# again, and the package-lock.json, requirements.txt and go.mod of the tools the tests run under
# crates/*/tools, among them the ones that lock the versions `ritsu gen` writes into the packages
# it makes (DESIGN 9.3; crates/ritsu/tests/audit.rs holds the two to each other).
#
# An advisory comes out without a change to the repository, so this runs every day as well as on
# every push, and release.yml runs it before it builds anything (DESIGN 13.2). What is let pass is
# in deny.toml and osv-scanner.toml, each with the reason; osv-scanner's has a date, after which
# the scan fails again until someone reads the reason again.
#
# The two tools are the releases' binaries at the versions below, held to their checksums, as
# tools.yml installs wasm-tools and protoc; no action outside GitHub's own runs here.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  OSV_SCANNER_VERSION: "2.6.0"
  OSV_SCANNER_SHA256: "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # cargo-deny reads the crate graph with `cargo metadata`; the runner's Rust is enough.
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: cargo-deny and osv-scanner, held to their checksums
        run: |
          set -eu
          d="$RUNNER_TEMP/audit"
          mkdir -p "$d"
          curl -fsSL -o "$d/cargo-deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$CARGO_DENY_SHA256  $d/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$d/cargo-deny.tar.gz" -C "$d" --strip-components=1
          curl -fsSL -o "$d/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $d/osv-scanner" | sha256sum -c -
          chmod +x "$d/osv-scanner"
          echo "$d" >> "$GITHUB_PATH"

      - name: The versions
        run: |
          cargo --version
          cargo-deny --version
          osv-scanner --version

      # Advisories (vulnerabilities, unsound and unmaintained crates, yanked versions), licenses,
      # duplicate versions and sources, as deny.toml says.
      - name: The crates (cargo-deny)
        run: cargo-deny --locked check --show-stats

      # Every lockfile under the root, with osv-scanner.toml. `--no-resolve`: a requirements.txt
      # that names only the packages it wants would be resolved through deps.dev into versions
      # nobody installs, so each one the tests install from is a full lock (crates/ritsu/tests/
      # audit.rs), and the scan reads the versions CI installs.
      - name: Every lockfile (osv-scanner)
        run: osv-scanner scan source --config osv-scanner.toml --no-resolve --recursive .
