name = "ritsu_proofs"
version = "0.1.0"
defaultTargets = ["RulecCert", "ChoboModel", "KoyomiModel", "DandoriCore", "RitsuCross", "rulec-recheck", "ritsu-model"]

# The Lean layer of ritsu (DESIGN 11): one package, one toolchain, no dependencies.
#
# `RulecCert` says what a rulec certificate means and proves that the checks it has to pass settle
# its claims; `rulec-recheck` runs those checks on a certificate. `ChoboModel`, `KoyomiModel` and
# `DandoriCore` model the core of three languages and prove what their checks settle; `RitsuCross`
# models the checks across the languages and proves that each of them settles what it says.
# `ritsu-model` runs the models on the inputs the Rust tests make (DESIGN 11.3).

[[lean_lib]]
name = "RulecCert"

[[lean_lib]]
name = "ChoboModel"

[[lean_lib]]
name = "KoyomiModel"

[[lean_lib]]
name = "DandoriCore"

[[lean_lib]]
name = "RitsuCross"

[[lean_exe]]
name = "rulec-recheck"
root = "RulecMain"

[[lean_exe]]
name = "ritsu-model"
root = "Main"
