[package]
name = "chobo"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small language for the things you count and move between accounts: stock, money, points, seats. Every bound on an account holds in one write."
repository.workspace = true

[dependencies]
ritsu-base = { path = "../ritsu-base" }
ritsu-emit = { path = "../ritsu-emit" }
ritsu-ports = { path = "../ritsu-ports" }
ritsu-units = { path = "../ritsu-units" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
ritsu-testkit = { path = "../ritsu-testkit" }
