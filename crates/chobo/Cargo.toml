[package]
name = "chobo"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small language for the things you count and move between accounts: stock, money, points, seats. Every bound on an account holds in one write."
repository = "https://github.com/i2y/chobo"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
