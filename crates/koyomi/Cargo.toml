[package]
name = "koyomi"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small language for closing days, payment days, business days and month arithmetic, checked on every day of its range and compiled to TypeScript, Python, Go, Rust and SQL"
repository = "https://github.com/i2y/koyomi"

[dependencies]
ritsu-base = { path = "../ritsu-base" }
ritsu-emit = { path = "../ritsu-emit" }
# preserve_order: `koyomi api` and `--format json` print their keys in the order DESIGN.md writes them
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
ritsu-testkit = { path = "../ritsu-testkit" }
