openapi: 3.2.0
info:
  title: Payments API
  version: 1.0.0
  description: Charges a card for an order, and tells how the charge went.
paths:
  /charges:
    post:
      operationId: createCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCharge'
      responses:
        '201':
          description: The charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
  /charges/{id}:
    get:
      operationId: getCharge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
components:
  schemas:
    NewCharge:
      type: object
      required: [orderId, card, amount]
      properties:
        orderId:
          type: string
        card:
          type: string
        amount:
          $ref: '../../common/money.yaml#/Money'
    Charge:
      type: object
      required: [id, orderId, status, amount]
      properties:
        id:
          type: string
        orderId:
          type: string
        status:
          $ref: '#/components/schemas/ChargeStatus'
        amount:
          $ref: '../../common/money.yaml#/Money'
    ChargeStatus:
      type: string
      enum: [pending, succeeded, failed, refunded]
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
