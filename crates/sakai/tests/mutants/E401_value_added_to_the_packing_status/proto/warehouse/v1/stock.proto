syntax = "proto3";

package warehouse.v1;

// Inventory's published language: reserving and releasing stock for each line of an order, and how packing is going.
service StockService {
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
}

service PackingService {
  rpc GetPacking(GetPackingRequest) returns (GetPackingResponse);
}

message ReserveRequest {
  string sku = 1;
  int32 quantity = 2;
}

enum Stock {
  STOCK_UNSPECIFIED = 0;
  STOCK_SECURED = 1;
  STOCK_SHORT = 2;
}

message ReserveResponse {
  string sku = 1;
  Stock stock = 2;
  optional string id = 3;
}

message ReleaseRequest {
  string id = 1;
}

message ReleaseResponse {}

enum PackingStatus {
  PACKING_STATUS_UNSPECIFIED = 0;
  PACKING_STATUS_WAITING = 1;
  PACKING_STATUS_PACKED = 2;
  PACKING_STATUS_SHORT = 3;
  PACKING_STATUS_DAMAGED = 4;
}

message GetPackingRequest {
  string order_id = 1;
}

message GetPackingResponse {
  PackingStatus status = 1;
}
