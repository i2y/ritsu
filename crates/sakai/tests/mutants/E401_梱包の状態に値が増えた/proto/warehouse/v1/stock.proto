syntax = "proto3";

package warehouse.v1;

import "buf/validate/validate.proto";

// 在庫の公表された言語。注文の一行ごとの引当と取消と確定、梱包の進み。
service StockService {
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  rpc Post(PostRequest) returns (PostResponse);
}

service PackingService {
  rpc GetPacking(GetPackingRequest) returns (GetPackingResponse);
}

message ReserveRequest {
  string sku = 1;
  int32 quantity = 2 [(buf.validate.field).int32 = {gte: 0, lte: 1000000}];
  // 在庫を押さえる注文の明細。押さえのキーで、答えが返す ID でもある
  string line_id = 3;
}

enum Stock {
  STOCK_UNSPECIFIED = 0;
  STOCK_SECURED = 1;
  STOCK_SHORT = 2;
  STOCK_CONFLICT = 3;
}

message ReserveResponse {
  string sku = 1;
  Stock stock = 2;
  optional string id = 3;
}

message ReleaseRequest {
  string id = 1;
}

message ReleaseResponse {}

// 注文が出荷されるときに、明細の押さえを確定する。先に期限が切れた押さえは棚に戻っている。
message PostRequest {
  string id = 1;
}

message PostResponse {}

enum PackingStatus {
  PACKING_STATUS_UNSPECIFIED = 0;
  PACKING_STATUS_WAITING = 1;
  PACKING_STATUS_PACKED = 2;
  PACKING_STATUS_SHORT = 3;
  PACKING_STATUS_DAMAGED = 4;
}

message GetPackingRequest {
  string order_id = 1;
}

message GetPackingResponse {
  PackingStatus status = 1;
}
