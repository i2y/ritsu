// Copied from rulec's tests/corpus/contracts/shipment.proto. The package is shop.delivery.v1, and the delivery service and the message that answers it are added.
syntax = "proto3";

package shop.delivery.v1;

import "buf/validate/validate.proto";

service DeliveryService {
  rpc CreateShipment(CreateShipmentRequest) returns (CreateShipmentResponse);
}

// The request the shipping service takes, validated by Protovalidate before anything reads it.
message CreateShipmentRequest {
  Destination destination = 1 [(buf.validate.field).required = true];
  repeated Parcel parcels = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 20}];
  int64 declared_value_jpy = 3 [(buf.validate.field).int64 = {gte: 0, lte: 1000000}];
  optional string delivery_window = 4 [(buf.validate.field).string = {in: ["morning", "evening"]}];
}

message Destination {
  string region = 1 [(buf.validate.field).string = {in: ["honshu", "hokkaido", "okinawa"]}];
  string postcode = 2;
}

message Parcel {
  int64 weight_g = 1 [(buf.validate.field).int64 = {gte: 1, lte: 30000}];
  Handling handling = 2;
}

enum Handling {
  HANDLING_STANDARD = 0;
  HANDLING_FRAGILE = 1;
}

message CreateShipmentResponse {
  string tracking_number = 1;
}

// The fee for delivering an order, which billing asks for before it bills.
service DeliveryFeeService {
  rpc QuoteFee(QuoteFeeRequest) returns (QuoteFeeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message QuoteFeeRequest {
  optional int64 parcels = 1;
}

message QuoteFeeResponse {
  int64 fee = 1;
  repeated FiredRow trace = 2;
}

message FiredRow {
  string table = 1;
  int32 row = 2;
  string label = 3;
}
