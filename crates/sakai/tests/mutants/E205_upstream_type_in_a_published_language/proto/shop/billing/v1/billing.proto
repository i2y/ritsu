syntax = "proto3";

package shop.billing.v1;

import "shop/ordering/v1/order.proto";

message Invoice {
  shop.ordering.v1.Order order = 1;
}

// Billing's published language.
enum BillingStatus {
  BILLING_STATUS_UNSPECIFIED = 0;
  BILLING_STATUS_WAIT = 1;
  BILLING_STATUS_BILL = 2;
  BILLING_STATUS_SKIP = 3;
}
