[package]
name = "sakai"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small language for the checkable part of a context map: which bounded context owns each artifact, which crossings the relationships allow, and how a layer maps the words and values that cross"
repository = "https://github.com/i2y/sakai"

[dependencies]
ritsu-base = { path = "../ritsu-base" }
ritsu-ports = { path = "../ritsu-ports" }
ritsu-proto = { path = "../ritsu-proto" }
# preserve_order: `sakai api` and `--format json` print their keys in the order DESIGN.md writes them
serde_json = { version = "1", features = ["preserve_order"] }

# The languages sakai reads, each through its own engine of ritsu's ports: the tests join them
# as `ritsu sakai` does (ritsu's DESIGN 3.3). sakai's own code holds none of them.
[dev-dependencies]
ritsu-testkit = { path = "../ritsu-testkit" }
chobo = { path = "../chobo" }
dandori = { path = "../dandori" }
koyomi = { path = "../koyomi" }
rulec = { path = "../rulec" }
