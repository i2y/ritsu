[package]
name = "ritsu"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "The one command of ritsu: the languages run with every port joined, so that what one language checks, the next reads as it is"
publish = false

# An entry may depend on every layer (DESIGN 3.1). The languages are joined once by ritsu-project,
# which hands the receiving ones the ports they read (DESIGN 6, 8.6).
[dependencies]
ritsu-base = { path = "../ritsu-base" }
ritsu-project = { path = "../ritsu-project" }
ritsu-cross = { path = "../ritsu-cross" }
ritsu-emit = { path = "../ritsu-emit" }
ritsu-ports = { path = "../ritsu-ports" }
chobo = { path = "../chobo" }
dandori = { path = "../dandori" }
geas = { path = "../geas" }
koyomi = { path = "../koyomi" }
rulec = { path = "../rulec" }
sakai = { path = "../sakai" }
yuen = { path = "../yuen" }
# `ritsu run` reads a scenario and writes a run as dandori's interpreter does, in serde_json's
# values (DESIGN 3.1, rule 4: an entry may use it)
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
ritsu-testkit = { path = "../ritsu-testkit" }
# The page in the browser, held to this binary by tests/playground.rs (a dev-dependency may close
# the circle: ritsu-wasm runs this crate's library).
ritsu-wasm = { path = "../ritsu-wasm" }
serde_json = { version = "1", features = ["preserve_order"] }
