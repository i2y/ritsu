openapi: 3.2.0
info:
  title: Catalog
  version: 1.0.0
paths:
  /products:
    query:
      operationId: searchProducts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: The products found
    additionalOperations:
      LINK:
        operationId: linkProducts
        responses:
          '204':
            description: Linked
  /products/{sku}:
    get:
      operationId: getProduct
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
        - name: filter
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
      responses:
        '200':
          description: The product
