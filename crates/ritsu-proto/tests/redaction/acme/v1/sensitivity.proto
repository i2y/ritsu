syntax = "proto3";

package acme.v1;

import "google/protobuf/descriptor.proto";

enum Sensitivity {
  SENSITIVITY_UNSPECIFIED = 0;
  PUBLIC = 1;
  PERSONAL = 2 [debug_redact = true];
}

extend google.protobuf.FieldOptions {
  Sensitivity sensitivity = 50001;
}

// An extension declared inside a message is named from the message.
message Holder {
  extend google.protobuf.FieldOptions {
    Sensitivity tag = 50003;
  }
}
