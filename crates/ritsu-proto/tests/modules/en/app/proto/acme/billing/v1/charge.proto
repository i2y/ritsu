// An import written with `@`: protoc does not see the dependencies of a module, so the import is
// not read, though `@lib/…` names lib's order elsewhere in the module.
syntax = "proto3";
package acme.billing.v1;

import "@lib/proto/acme/orders/v1/order.proto";

message Charge {
  acme.orders.v1.Order order = 1;
}
