// 手元のモジュールの明細書。lib の合計を持つ。どのファイルも自分のモジュールの金額を読む。app の
// ファイルは app の、lib の合計は lib の金額である。一回の protoc は、最初に見つけたルートの金額を
// 両方に読むので、このファイルと、これが import するファイルは、一緒に protoc に渡せない。
syntax = "proto3";
package acme.billing.v1;

import "acme/orders/v1/total.proto";

message Statement {
  acme.orders.v1.Total total = 1;
}
