[package]
name = "ritsu-proto"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "The one reader of .proto files the languages of ritsu share: the messages, enums and services, the options as written and as a tree, Protovalidate's rules, buf.yaml and buf.lock, and the names of types resolved by protobuf's rule"
publish = false

# ritsu-base and std (DESIGN 3.1).
[dependencies]
ritsu-base = { path = "../ritsu-base" }

# The tests hold the reader to the readers it takes the place of: rulec's and dandori's, which
# stay in their crates until D.10 (DESIGN 3.3: a dev-dependency makes no loop).
[dev-dependencies]
ritsu-testkit = { path = "../ritsu-testkit" }
rulec = { path = "../rulec" }
dandori = { path = "../dandori" }
