syntax = "proto3";

package client_send_once.v1;

import "dandori/v1/options.proto";

service Svc {
  option (dandori.v1.workflow) = {name: "client_send_once", version: 1};

  rpc Begin(Order) returns (Reply) {
    option (dandori.v1.start) = {fails: ["Late"]};
  }

  rpc SendOnce(Sent) returns (Ack) {
    option (dandori.v1.event) = {task: "wait"};
  }

  rpc GetStatus(StatusRequest) returns (dandori.v1.Status) {
    option (dandori.v1.status) = {};
  }
}

message Order {
  string id = 1;
}

message Reply {
  string id = 1;
}

message Sent {
  string note = 1;
}

message Ack {}

message StatusRequest {}
