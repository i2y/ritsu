syntax = "proto3";

package client_message.ja.v1;

import "dandori/v1/options.proto";

service Svc {
  option (dandori.v1.workflow) = {name: "クライアントのメッセージ", version: 1};

  rpc Begin(Order) returns (Reply) {
    option (dandori.v1.start) = {fails: ["Late"]};
  }

  rpc Tell(Client) returns (Ack) {
    option (dandori.v1.event) = {task: "待つ"};
  }

  rpc GetStatus(StatusRequest) returns (dandori.v1.Status) {
    option (dandori.v1.status) = {};
  }
}

message Order {
  string id = 1;
}

message Reply {
  string id = 1;
}

message Client {
  string note = 1;
}

message Ack {}

message StatusRequest {}
