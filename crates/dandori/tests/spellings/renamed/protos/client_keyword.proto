syntax = "proto3";

package client_keyword.v1;

import "dandori/v1/options.proto";

service Svc {
  option (dandori.v1.workflow) = {name: "client_keyword", version: 1};

  rpc Begin(Amount) returns (Reply) {
    option (dandori.v1.start) = {fails: ["Late"]};
  }

  rpc Remove(Sent) returns (Ack) {
    option (dandori.v1.event) = {task: "wait"};
  }

  rpc GetStatus(StatusRequest) returns (dandori.v1.Status) {
    option (dandori.v1.status) = {};
  }
}

message Amount {
  string id = 1;
}

message Reply {
  string id = 1;
}

message Sent {
  string note = 1;
}

message Ack {}

message StatusRequest {}
