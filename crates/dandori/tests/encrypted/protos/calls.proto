// The service tests/encrypted/names.flow implements, whose history is encrypted. Its methods and
// messages have the names the client dandori writes declares for such a workflow. A caller reads
// some of them: the method Connect is `connect` in Python, EncryptedClient is `encryptedClient` in
// TypeScript, and EncryptedClient and Dial are Go's. So check says W105 of these, for the language
// whose client has them, and gen stops there (E051). The client has the others for itself alone
// (the method Encrypted is `encrypted` in TypeScript; the messages Connection, PayloadCodec and
// ClientOptions are TypeScript's, NewType, PayloadCodec and DataConverter Python's, and
// CodecFailureConverter and CodecDataConverter Go's), and gives its own other names where the
// service takes them. In Go, the method CodecFailureConverter and the message CodecDataConverter
// are one name with the record and the enum of the flow, which W105 says. (A method cannot have
// the name of a message the service takes: inside the service, protoc reads the name as the
// method's.)
syntax = "proto3";

package calls.v1;

import "dandori/v1/options.proto";

service CallService {
  option (dandori.v1.workflow) = {name: "names", version: 1};

  rpc Connect(Connection) returns (NewType) {
    option (dandori.v1.start) = {fails: ["NoAnswer", "Unconfirmed"]};
  }

  rpc EncryptedClient(PayloadCodec) returns (Ack) {
    option (dandori.v1.event) = {task: "pick_up"};
  }

  rpc Encrypted(ClientOptions) returns (Ack) {
    option (dandori.v1.event) = {task: "hold"};
  }

  rpc Dial(DataConverter) returns (Ack) {
    option (dandori.v1.answer) = {task: "call"};
  }

  rpc CodecFailureConverter(CodecDataConverter) returns (Ack) {
    option (dandori.v1.answer) = {task: "confirm"};
  }

  rpc GetStatus(StatusRequest) returns (dandori.v1.Status) {
    option (dandori.v1.status) = {};
  }
}

message Connection {
  string number = 1;
  Line line = 2;
}

enum Line {
  landline = 0;
  mobile = 1;
}

message NewType {
  string receipt = 1;
}

message PayloadCodec {
  bool answered = 1;
}

message ClientOptions {
  string reason = 1;
}

message DataConverter {
  string answer = 1;
}

message CodecDataConverter {
  string note = 1;
}

message Ack {}

message StatusRequest {}
