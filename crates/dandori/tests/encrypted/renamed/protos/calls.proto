// calls.proto with the names W105 says of it changed.
syntax = "proto3";

package calls.v1;

import "dandori/v1/options.proto";

service CallService {
  option (dandori.v1.workflow) = {name: "names", version: 1};

  rpc Begin(CallRequest) returns (Receipt) {
    option (dandori.v1.start) = {fails: ["NoAnswer", "Unconfirmed"]};
  }

  rpc PickUp(PickUpNote) returns (Ack) {
    option (dandori.v1.event) = {task: "pick_up"};
  }

  rpc Hold(HoldNote) returns (Ack) {
    option (dandori.v1.event) = {task: "hold"};
  }

  rpc Reply(ReplyNote) returns (Ack) {
    option (dandori.v1.answer) = {task: "call"};
  }

  rpc Confirm(ConfirmNote) returns (Ack) {
    option (dandori.v1.answer) = {task: "confirm"};
  }

  rpc GetStatus(StatusRequest) returns (dandori.v1.Status) {
    option (dandori.v1.status) = {};
  }
}

message CallRequest {
  string number = 1;
  Line line = 2;
}

enum Line {
  landline = 0;
  mobile = 1;
}

message Receipt {
  string receipt = 1;
}

message PickUpNote {
  bool answered = 1;
}

message HoldNote {
  string reason = 1;
}

message ReplyNote {
  string answer = 1;
}

message ConfirmNote {
  string note = 1;
}

message Ack {}

message StatusRequest {}
