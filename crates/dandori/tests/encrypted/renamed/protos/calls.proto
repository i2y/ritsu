// calls.proto with the names W105 says of it changed. The method and the messages named as what
// a client has for itself alone keep their names: the client gives its own others.
syntax = "proto3";

package calls.v1;

import "dandori/v1/options.proto";

service CallService {
  option (dandori.v1.workflow) = {name: "names", version: 1};

  rpc Begin(Connection) returns (NewType) {
    option (dandori.v1.start) = {fails: ["NoAnswer", "Unconfirmed"]};
  }

  rpc PickUp(PayloadCodec) returns (Ack) {
    option (dandori.v1.event) = {task: "pick_up"};
  }

  rpc Encrypted(ClientOptions) returns (Ack) {
    option (dandori.v1.event) = {task: "hold"};
  }

  rpc Reply(DataConverter) returns (Ack) {
    option (dandori.v1.answer) = {task: "call"};
  }

  rpc Confirm(ConfirmNote) returns (Ack) {
    option (dandori.v1.answer) = {task: "confirm"};
  }

  rpc GetStatus(StatusRequest) returns (dandori.v1.Status) {
    option (dandori.v1.status) = {};
  }
}

message Connection {
  string number = 1;
  Line line = 2;
}

enum Line {
  landline = 0;
  mobile = 1;
}

message NewType {
  string receipt = 1;
}

message PayloadCodec {
  bool answered = 1;
}

message ClientOptions {
  string reason = 1;
}

message DataConverter {
  string answer = 1;
}

message ConfirmNote {
  string note = 1;
}

message Ack {}

message StatusRequest {}
