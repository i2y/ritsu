// An order as the order service of the module lib sends it. The import of the money is written from
// the root of the module, which is where protoc reads the module's files from.
syntax = "proto3";

package acme.orders.v1;

import "buf/validate/validate.proto";
import "proto/acme/orders/v1/money.proto";

message Order {
  string id = 1;
  int64 subtotal_pence = 2 [(buf.validate.field).int64 = {gte: 0, lte: 2000000}];
  Money paid = 3;
}
