syntax = "proto3";

package acme.v1;

import "google/protobuf/descriptor.proto";

// How sensitive a field is. A value marked debug_redact makes the fields it is given to secret.
enum Sensitivity {
  SENSITIVITY_UNSPECIFIED = 0;
  PUBLIC = 1;
  PERSONAL = 2 [debug_redact = true];
}

extend google.protobuf.FieldOptions {
  Sensitivity sensitivity = 50001;
}
