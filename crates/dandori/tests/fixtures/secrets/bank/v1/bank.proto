syntax = "proto3";

package bank.v1;

import "acme/v1/sensitivity.proto";

// An account at the bank. Its number is kept out of the debug formats, and so is the name it is
// held in, by the option of the organisation's own that says how sensitive a field is.
message Account {
  string id = 1;
  string number = 2 [debug_redact = true];
  string holder = 3 [(acme.v1.sensitivity) = PERSONAL];
  string branch = 4 [(acme.v1.sensitivity) = PUBLIC];
  string sort_code = 5 [debug_redact = false];
}

message GetAccountRequest {
  string id = 1;
}

message PayRequest {
  string account_id = 1;
  int32 amount = 2;
  string note = 3;
  string account_number = 4 [debug_redact = true];
}

message PayResponse {
  string payment_id = 1;
}

service AccountService {
  rpc GetAccount(GetAccountRequest) returns (Account);
}

service PayoutService {
  rpc Pay(PayRequest) returns (PayResponse);
}
