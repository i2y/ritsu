[package]
name = "dandori"
version = "0.1.0"
edition = "2021"
description = "A small typed language for workflows that call business rules, checked before it runs and compiled to AWS Step Functions, Temporal, Lambda durable functions and Argo Workflows"
license = "MIT OR Apache-2.0"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
