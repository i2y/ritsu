name: ci

# `cargo test` on every push and pull request.
#
# It had never run here (DESIGN §15.94): `docs` builds the site and `release`
# builds the binaries, and neither runs a test — so the suite that holds this
# tool together was only ever green on one laptop, and `release.yml` shipped
# binaries nothing had tested.
#
# The suite reaches outside for one thing: `rulec test` runs the generated code
# in every language and compares it with the reference evaluator. A language
# whose toolchain is missing is skipped and reported as skipped, which is the
# right behaviour for someone trying the tool — and the wrong thing to accept
# here, because a skipped language narrows what the run proved and says so in a
# line that is easy to read past. So every toolchain is installed, and the step
# below fails the job when anything was skipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The suite asserts Japanese wording in places; `.cargo/config.toml` pins this
  # for everything cargo launches, and it is set here too for the steps that
  # call the binary directly.
  RULEC_LANG: ja
  # The model checker behind the proof harnesses (DESIGN §15.95). Pinned: a new
  # version that decides differently should be a change in this file, read as
  # such, and not something a rerun quietly brings in.
  KANI_VERSION: "0.68.0"
  # The compiler that builds the Connect stubs (DESIGN §15.112). Pinned for the same reason
  # Kani is, and because buf decides *how* the plugins are called: the local ones run once per
  # directory unless the template says otherwise, which is the difference between a quiet
  # generate and a warning per package.
  BUF_VERSION: "1.54.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # `rulec test` runs the generated SQL against a real PostgreSQL, because the
    # query and the function beside it are two doors on one rule and only a
    # server can open the second.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v7

      # --- The twelve targets, in the order backend.rs declares them.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: NumPy, and the checkers the generated Python is held to
        run: python3 -m pip install --upgrade numpy mypy ruff

      # The rule as a Connect service (DESIGN §15.112): buf builds the stubs, the two
      # plugins write them, `connectrpc` is what the generated service imports, and uvicorn
      # is the ASGI half's server — the WSGI half runs on the standard library's own.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}

      - name: The Connect runtime and the plugins that write its stubs
        run: python3 -m pip install --upgrade connectrpc protoc-gen-connectrpc protoc-gen-py uvicorn

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: RBS and Steep, for the generated Ruby's signatures
        run: gem install rbs steep

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: wasmtime, for the WASI pass
        uses: bytecodealliance/actions/wasmtime/setup@v1

      # Kani reads the proof harnesses `gen` writes beside the Rust (DESIGN §15.95).
      # It brings its own rustc and CBMC — about 2 GB — so it is cached on the
      # pinned version, and `rulec test` skips the pass with a note when it is
      # absent. A note the step below reads as a failure, which is the point.
      - name: Cache Kani
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: kani-${{ runner.os }}-${{ env.KANI_VERSION }}

      - name: Kani, for the proofs beside the Rust
        run: |
          set -eu
          if ! kani --version >/dev/null 2>&1; then
            cargo install --locked --version "$KANI_VERSION" kani-verifier
            cargo kani setup
          fi
          kani --version

      - name: uv, for the site's own tooling
        uses: astral-sh/setup-uv@v10.0.1

      # --- Say what is here before the suite runs, so a version that moved is
      # readable in the log rather than only in a failure.
      - name: The toolchains this run has
        run: |
          set -x
          rustc --version && cargo --version
          python3 --version && python3 -c 'import numpy; print("numpy", numpy.__version__)'
          node --version && ruby --version && php --version
          go version && javac -version && swiftc --version
          wasmtime --version && psql --version && kani --version
          buf --version && protoc-gen-py --version && protoc-gen-connectrpc --version
          python3 -c 'import connectrpc, uvicorn, importlib.metadata as m; print("connectrpc", m.version("connectrpc"), "uvicorn", m.version("uvicorn"))'
          psql -c 'select version()'

      # `website/docs-ja/` is half copied in by sync.sh and gitignored — the Japanese
      # pages share the English diagrams rather than keeping a second copy. The link
      # test walks those pages, so on a fresh checkout it looks at a tree that is not
      # there yet. `docs.yml` runs sync.sh as part of build.sh; this job has to as
      # well (DESIGN §15.94).
      - name: Copy in the documents the site shares
        run: ./website/sync.sh

      - name: cargo test
        run: cargo test --locked

      # `--proofs` adds the model checker's pass to the same run (DESIGN §15.95), so the
      # pass itself — not only the harnesses it reads — is exercised here.
      # --- The suite skips a language whose toolchain is missing; here that is a
      # failure, not a note. `--require-all` counts the twelve languages. The PostgreSQL *function* beside
      # the query is a thirteenth door, and the rule as a Connect service (DESIGN
      # §15.112) is a fourteenth; each is skipped with a warning of its own when what
      # it needs is not here, and `--require-all` sees neither — so the warnings are
      # read here as well. Measured: with no psql at all, `--require-all` still exits
      # 0 (DESIGN §15.94).
      - name: The generated code runs in every language, none skipped
        run: |
          set -eu -o pipefail
          out=$(mktemp -d)
          cargo run --quiet --locked -- gen tests/corpus/ゆうパック運賃.rule --out "$out"
          cargo run --quiet --locked -- test "$out" --require-all --proofs --lang en | tee /tmp/run.log
          if grep -q "skipped" /tmp/run.log; then
            echo "::error::a side was skipped; every toolchain is supposed to be here"
            grep "skipped" /tmp/run.log
            exit 1
          fi

      # Every rule in the corpus, proved as Rust over its whole declared domain
      # rather than over the vectors: no table falls through, no W114 guard
      # fires, nothing overflows an i64, and the rows of each `unique` table
      # cover the domain exactly once (DESIGN §15.95). A second opinion on the
      # first two of the five proofs, from a tool that shares no code with the
      # checker — so a disagreement means one of them is wrong, which is the
      # whole reason to run it.
      - name: The proofs hold, for every rule in the corpus
        run: |
          set -eu -o pipefail
          out=$(mktemp -d)
          cargo run --quiet --locked -- gen tests/corpus/ --out "$out" > /dev/null
          bad=0
          rules=0
          harnesses=0
          for f in "$out"/rust/*_proof.rs; do
            name=$(basename "$f" _proof.rs)
            start=$SECONDS
            if log=$(kani "$f" 2>&1); then
              n=$(printf '%s\n' "$log" | grep -c '^VERIFICATION:- SUCCESSFUL' || true)
              printf '%-24s %3ds  %s\n' "$name" "$((SECONDS - start))" \
                "$(printf '%s\n' "$log" | grep -E '^Complete - ' | tail -1)"
              rules=$((rules + 1))
              harnesses=$((harnesses + n))
            else
              # Kani's own report is thousands of lines of checks that passed; what says
              # what went wrong is the summary of each harness and the assertion it broke.
              echo "::error::$name did not verify"
              printf '%s\n' "$log" | grep -E '^ \*\* [0-9]+ of|^Failed Checks:|^ File:|^VERIFICATION:|^Verification failed for|^Complete - '
              bad=1
            fi
          done
          echo "$rules rules, $harnesses harnesses verified"
          exit $bad

      # The certificate is evidence only if something other than rulec can read it, so the
      # re-checker reads all thirty (DESIGN §15.96). It needs nothing but python3. With
      # `--rule` it also holds the certificate to the text it is about: the digest, and
      # every cell read back out of the file at the byte span the certificate names
      # (§15.97).
      - name: The certificates re-check, without rulec
        run: |
          set -eu -o pipefail
          n=0
          for f in tests/corpus/*.rule; do
            cargo run --quiet --locked -- certificate "$f" > /tmp/cert.json
            python3 tools/recheck.py --rule "$f" /tmp/cert.json | grep "the file says the same"
            python3 tools/recheck.py --rule "$f" /tmp/cert.json | tail -1 | grep -E 'was proved|stated rather than proved' > /dev/null
            n=$((n + 1))
          done
          echo "$n certificates re-checked, each against its own text"

      - name: fmt and the committed output are current
        run: |
          set -eu
          cargo run --quiet --locked -- fmt --check tests/corpus/
          cargo run --quiet --locked -- check tests/corpus/

  # The Lean development (DESIGN §15.97): the meaning of a rule, the checks a
  # certificate has to pass, and the theorems that say a `true` from each check
  # settles the matching claim. `lake build` is what makes "proved" a fact about
  # this commit rather than about a laptop — and the program it builds is the
  # checks themselves, so running it over the corpus is the proofs applied to
  # thirty documents.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-proofs-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-proofs-${{ runner.os }}-

      # The toolchain is pinned by `proofs/lean-toolchain`, so the cache key is
      # that file: a new Lean is a change in the repository, read as such.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            proofs/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/RulecCert/*.lean', 'proofs/Main.lean') }}
          restore-keys: lean-${{ runner.os }}-

      - name: elan, for Lean
        run: |
          set -eu
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: The proofs build
        run: |
          set -eu
          cd proofs
          lake build
          lean --version

      - name: Every certificate passes the checks the theorems are about
        run: |
          set -eu -o pipefail
          cargo build --release --locked
          for f in tests/corpus/*.rule; do
            ./target/release/rulec certificate "$f" > /tmp/cert.json
            # The closing line says whether anything was stated rather than proved, so it
            # is the one to log — and a run that printed neither form is a run that went
            # wrong quietly.
            ./proofs/.lake/build/bin/rulec-recheck --rule "$f" /tmp/cert.json | tail -1 | grep -E '^OK'
          done
          echo "every certificate in the corpus was held to the proved checks"

      - name: The corpus passes both re-checkers, and nothing is left open
        run: cargo test --release --locked --test lean
