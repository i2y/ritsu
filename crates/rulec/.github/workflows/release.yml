  #       id: have
  #       run: |
  #         code=$(curl -s -o /dev/null -w '%{http_code}' -A 'rulec release (https://github.com/i2y/rulec)' \
  #           "https://crates.io/api/v1/crates/rulec/${GITHUB_REF_NAME#v}")
  #         case "$code" in
  #           200) echo "::notice::rulec ${GITHUB_REF_NAME#v} is on crates.io already"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
  #           404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
