name: rulec
description: Put one release of rulec on the PATH, verified against the checksums published with it.
author: Yasushi Itoh

# `uses: i2y/rulec@v0.14.1` installs release v0.14.1: the ref the action is
# referenced with is the release, so the action and the binary cannot drift
# apart. Nothing else is done here — the gate is five `run:` lines anyone can
# read, and posting a diff to a pull request is one line of `gh` (DESIGN §12).

inputs:
  version:
    description: The release to install, as its tag (v0.14.1). Empty means the ref this action was referenced with.
    required: false
    default: ""
  sha256:
    description: The SHA-256 of the archive for this runner's platform, to pin it. Empty verifies against the release's SHA256SUMS alone.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PIN: ${{ inputs.sha256 }}
        REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        ver="${VERSION:-$REF}"
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  target=x86_64-unknown-linux-musl ;;
          Linux-aarch64) target=aarch64-unknown-linux-musl ;;
          Darwin-x86_64) target=x86_64-apple-darwin ;;
          Darwin-arm64)  target=aarch64-apple-darwin ;;
          *) echo "::error::no rulec release is built for $(uname -s)-$(uname -m)"; exit 2 ;;
        esac
        name="rulec-$ver-$target.tar.gz"
        base="https://github.com/i2y/rulec/releases/download/$ver"
        dir="$RUNNER_TEMP/rulec-$ver"
        mkdir -p "$dir"
        cd "$dir"
        curl -fsSL --retry 3 -o "$name" "$base/$name"
        curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
        if command -v sha256sum >/dev/null 2>&1; then
          have=$(sha256sum "$name" | cut -d' ' -f1)
        else
          have=$(shasum -a 256 "$name" | cut -d' ' -f1)
        fi
        want=$(awk -v n="$name" '$2 == n { print $1 }' SHA256SUMS)
        if [ -z "$want" ]; then echo "::error::SHA256SUMS of $ver has no line for $name"; exit 1; fi
        if [ "$have" != "$want" ]; then echo "::error::$name: sha256 is $have, SHA256SUMS says $want"; exit 1; fi
        if [ -n "$PIN" ] && [ "$have" != "$PIN" ]; then echo "::error::$name: sha256 is $have, the workflow pins $PIN"; exit 1; fi
        tar -xzf "$name"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/rulec" --version
