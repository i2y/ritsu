syntax = "proto3";

package shop.v1;

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_BASIC = 1;
  TIER_SILVER = 2;
  TIER_GOLD = 3;
  TIER_PLATINUM = 7;
}

message FiredRow {
  string table = 4;
  int32 row = 1;
  string label = 2;
}

message QuoteRequest {
  optional Tier member = 2;
  reserved 3, 4;
  reserved "coupon";
  optional int64 subtotal = 5;
  optional Tier campaign = 9;
}

message QuoteResponse {
  bool lifted = 7;
  int64 shipping = 3;
  Tier effective = 1;
  repeated FiredRow trace = 15;
}

service MemberShippingService {
  rpc Quote(QuoteRequest) returns (QuoteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

service PlainService {
  rpc GetQuote(QuoteRequest) returns (QuoteResponse);
}
