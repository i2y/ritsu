name: check

# Every push and pull request: the rules pass check, the committed generated
# code matches a fresh generation, and the generated code answers like the
# reference evaluator in every language the runner has.
#
# `uses: i2y/ritsu@<tag>` installs that release of ritsu (ritsu's action.yml),
# which puts `rulec` on the PATH as a link to `ritsu`; rulec's releases are
# ritsu's from 0.23.0 on. The rules here cite supplementary provisions and rely
# on `Cites:` headers, which every release since 0.6.0 has.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The rule as a PostgreSQL function is held to the vectors on a real server, and
    # without one that pass is skipped while the run stays green — the same quiet
    # narrowing the numpy step below prevents.
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_PASSWORD: rulec, POSTGRES_DB: rulec }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: rulec
      PGDATABASE: rulec
    steps:
      - uses: actions/checkout@v7
      - uses: i2y/ritsu@v0.25.0
      - run: rulec fmt --check rules/
      - run: rulec check rules/
      - run: rulec gen rules/ --out generated/ --check
      - run: rulec coverage rules/
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # The NumPy target is read by an evaluator that imports numpy, so without
      # this the language is skipped and the run stays green.
      - run: python3 -m pip install --quiet numpy
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/setup-go@v6
        with: { go-version: "1.22" }
      - run: rulec test generated/
