# The .deb and the .rpm of one release (DESIGN §15.158). packaging/linux.sh fills in the
# three variables from the static binary in the release archive. That binary needs no
# library, so the packages depend on nothing and install the same file the archive holds.
name: rulec
arch: ${RULEC_ARCH}
platform: linux
version: ${RULEC_VERSION}
release: "1"
section: devel
priority: optional
maintainer: Yasushi Itoh <6240399+i2y@users.noreply.github.com>
homepage: https://i2y.github.io/rulec/
license: MIT OR Apache-2.0
description: |-
  A little language for business rules.
  Each rule is proved free of gaps and contradictions before it compiles to plain
  code, with no runtime and no dependencies.

contents:
  - src: ${RULEC_BINARY}
    dst: /usr/bin/rulec
    expand: true
    file_info:
      mode: 0755
  - src: LICENSE-MIT
    dst: /usr/share/doc/rulec/LICENSE-MIT
    file_info:
      mode: 0644
  - src: LICENSE-APACHE
    dst: /usr/share/doc/rulec/LICENSE-APACHE
    file_info:
      mode: 0644
