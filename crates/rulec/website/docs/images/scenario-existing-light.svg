<text x="29" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">an article on e-Gov</text>
<text x="29" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">a policy PDF</text>
<text x="29" y="90.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">a tariff sheet</text>
<clipPath id="clip-1"><rect x="246" y="20" width="150" height="196" rx="10"/></clipPath>
<rect x="246" y="20" width="150" height="196" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
