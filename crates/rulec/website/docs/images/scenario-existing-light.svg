<text x="788.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">rulec</text>
<text x="788.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">holds it to the copy</text>
<text x="788.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">proves no gap,</text>
<text x="788.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">no overlap</text>
