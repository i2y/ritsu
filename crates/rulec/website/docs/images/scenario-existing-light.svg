<text x="444.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5b6478">writes</text>
<line x1="612" y1="70" x2="708" y2="70" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="660.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rulec check</text>
<text x="660.0" y="88" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5b6478">fetch, pin too</text>
