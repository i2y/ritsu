<path d="M628.0,132 V144 H640.0 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="473.0" y="154" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">Amendment</text>
<text x="473.0" y="172" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">what changes,</text>
<text x="473.0" y="187" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">from when</text>
<line x1="708" y1="172" x2="640.0" y2="172" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<line x1="464.0" y1="172" x2="396" y2="172" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="552.0" y="227" font-size="11" font-weight="400" text-anchor="middle" fill="#4457d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rulec source outdated</text>
<clipPath id="clip-person"><rect x="703.0" y="290" width="170" height="148" rx="10"/></clipPath>
<rect x="703.0" y="290" width="170" height="148" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="703.0" y="290" width="170" height="5" fill="#9c6508" clip-path="url(#clip-person)"/>
<text x="788.0" y="333" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">Approver</text>
<text x="788.0" y="362" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">compares the article</text>
<text x="788.0" y="381" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">with the table</text>
<text x="788.0" y="400" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">and signs off</text>
