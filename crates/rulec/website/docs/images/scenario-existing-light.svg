<path d="M600,20.0 V32.0 H612 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="501" y="42.0" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">Table</text>
<text x="603" y="42.0" font-size="9.5" font-weight="400" text-anchor="end" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="501" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">@法 第91条</text>
<text x="501" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">pinned to a copy</text>
