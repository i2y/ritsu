<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 262" role="img" aria-label="One check decides three defects. A gap (E101) is a stretch of the input space no row covers. An overlap (E105) is a stretch two rows both cover, under policy unique. An unreachable row (E102) is a row whose whole stretch the earlier rows take first, under policy first. All three are decided by the same arithmetic on the same rectangles, and the first two hand back the input that causes them." font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
