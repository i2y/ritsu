<text x="29" y="410" font-size="10" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">def fee(dest: Zone, weight: Gram) -&gt; YenInclTax:</text>
<text x="29" y="425" font-size="10" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    ...</text>
<text x="29" y="440" font-size="10" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    if dest == Zone.KINKI and weight &lt;= 2000:  # row 1: Kinki | &lt;=2kg | 800円</text>
<text x="29" y="455" font-size="10" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">        fee = 800</text>
<text x="29" y="470" font-size="10" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    ...</text>
<text x="29" y="485" font-size="10" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    else:</text>
<text x="29" y="500" font-size="10" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">        raise AssertionError("unreachable: completeness was statically checked by rulec")</text>
<text x="29" y="515" font-size="10" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    return _round_up(fee, 10)</text>
