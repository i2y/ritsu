<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" role="img" aria-label="Write the table. rulec turns each row into a box in the input space and proves by computation that the boxes leave no gap and no overlap. If there is a gap, back comes the input that falls through it (Destination = Remote, Weight = 2001g): add the row and run again - only what the fee is takes a person. Only a proved table generates, and what comes out is dependency-free Python, TypeScript and Go." font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
