<text x="813.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">rulec</text>
<text x="813.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">パスをたどる</text>
<text x="813.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">値の集合をそろえる</text>
<text x="813.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">検証と宣言を</text>
<text x="813.0" y="149" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">突き合わせる</text>
