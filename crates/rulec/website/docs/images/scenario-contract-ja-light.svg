<text x="218.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5b6478">読む</text>
<line x1="416" y1="70" x2="512" y2="70" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="464.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5b6478">結ぶ</text>
