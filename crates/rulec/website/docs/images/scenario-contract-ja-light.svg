<text x="993" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">値が増えた E032</text>
<text x="993" y="90.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">契約の方が広い E122</text>
