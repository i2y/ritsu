<text x="29" y="42.0" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">API の契約</text>
<text x="29" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">.proto と Protovalidate</text>
<text x="29" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">OpenAPI</text>
<text x="29" y="90.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">JSON Schema</text>
<clipPath id="clip-1"><rect x="266" y="20" width="150" height="196" rx="10"/></clipPath>
<rect x="266" y="20" width="150" height="196" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="266" y="20" width="150" height="5" fill="#4457d8" clip-path="url(#clip-1)"/>
<text x="341.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">エージェント</text>
<text x="341.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">入力を契約に結ぶ</text>
<text x="341.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">shape と from</text>
<text x="341.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">列挙は import</text>
<path d="M512,20.0 H630 L642,32.0 V120.0 H512 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M630,20.0 V32.0 H642 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="521" y="42.0" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">表</text>
<text x="633" y="42.0" font-size="9.5" font-weight="400" text-anchor="end" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="521" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">from 注文.lines</text>
<text x="521" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">import proto</text>
<clipPath id="clip-3"><rect x="738" y="20" width="150" height="196" rx="10"/></clipPath>
<rect x="738" y="20" width="150" height="196" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
