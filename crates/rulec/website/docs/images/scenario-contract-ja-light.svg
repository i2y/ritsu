<rect x="728.0" y="290" width="170" height="148" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="728.0" y="290" width="170" height="5" fill="#9c6508" clip-path="url(#clip-person)"/>
<text x="813.0" y="333" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">決める人</text>
<text x="813.0" y="362" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">契約と規則の</text>
