<path d="M653.0,132 V144 H665.0 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="498.0" y="154" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">食い違い</text>
<text x="498.0" y="172" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">その値と</text>
<text x="498.0" y="187" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">契約に書く注釈</text>
<line x1="738" y1="172" x2="665.0" y2="172" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<line x1="489.0" y1="172" x2="416" y2="172" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="577.0" y="227" font-size="11" font-weight="400" text-anchor="middle" fill="#4457d8">直すまで繰り返す</text>
