<text x="741" y="135" font-size="10" font-weight="400" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    elif dest == Zone.KINKI and weight &gt; 5000:  # 行3: 近畿圏 | &gt;5kg | 1300円</text>
<text x="741" y="150" font-size="10" font-weight="400" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">        fee = 1300</text>
<text x="741" y="165" font-size="10" font-weight="400" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    ...</text>
<text x="741" y="180" font-size="10" font-weight="400" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    return _round_up(fee, 10)</text>
