<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003.8 252" role="img" aria-label="表は何段でも重ねられる。表 重さ判定 が 重量 から 区分 を出し、その 区分 が 表 帯判定 の列になり、出てきた 帯 が 表 送料表 の列になる。導出した 支払額 も列として入り、最後の表が 送料 と 倍率 を同時に出して、請求額 と 付与点 になる。色のついた欄は前の段が作った値。" font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
