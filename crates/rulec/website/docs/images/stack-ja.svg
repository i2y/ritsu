<path d="M971.8,84 V96 H983.8 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="748.0" y="116" font-size="10.5" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">result 請求額 = max(支払額, 0円) + 送料</text>
<text x="748.0" y="136" font-size="10.5" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">define 付与点 = 基本点 × 倍率</text>
