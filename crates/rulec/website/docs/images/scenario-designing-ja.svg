<text x="603" y="42.0" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="501" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">1 規則 = 1 表</text>
<text x="501" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">例も書く</text>
