<line x1="464.0" y1="172" x2="396" y2="172" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="552.0" y="227" font-size="11" font-weight="400" text-anchor="middle" fill="#8e9cff">通るまで繰り返す</text>
