<text x="29" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">送料、クーポン</text>
<text x="29" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">返品の可否</text>
<text x="29" y="90.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">社内の判定基準</text>
