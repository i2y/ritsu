<path d="M628.0,132 V144 H640.0 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="473.0" y="154" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">診断</text>
<text x="473.0" y="172" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">どこが</text>
<text x="473.0" y="187" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">それを起こす入力</text>
<text x="473.0" y="202" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">足す行の形</text>
