<text x="321.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Excel からでも</text>
<text x="321.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">金額は自分で決める</text>
