<text x="841.5" y="116" font-size="10.5" font-weight="400" text-anchor="start" fill="#e8ebf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">result compensation = base × factor</text>
<text x="841.5" y="206" font-size="9.5" font-weight="400" text-anchor="start" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">output</text>
<rect x="841.5" y="216" width="84.0" height="22" rx="5" fill="#8e9cff" fill-opacity="0.18" stroke="#8e9cff" stroke-opacity="0.8"/>
<text x="883.5" y="231.0" font-size="11" font-weight="400" text-anchor="middle" fill="#e8ebf4">compensation</text>
<line x1="847.5" y1="164" x2="847.5" y2="192" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="20" y="258" font-size="10.5" font-weight="400" text-anchor="start" fill="#98a1b8">A filled column is a value an earlier step produced</text>
</svg>
