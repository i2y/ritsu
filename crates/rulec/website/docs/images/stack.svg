<rect x="301.0" y="125.0" width="40.0" height="22" rx="5" fill="#8e9cff" fill-opacity="0.18" stroke="#8e9cff" stroke-opacity="0.8"/>
<text x="321.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#e8ebf4">band</text>
<text x="355.5" y="140" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-&gt;</text>
<rect x="370.0" y="125.0" width="40.0" height="22" rx="5" fill="#8e9cff" fill-opacity="0.18" stroke="#8e9cff" stroke-opacity="0.8"/>
<text x="390.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#e8ebf4">base</text>
