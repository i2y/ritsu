<text x="60.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8">distance</text>
<rect x="98.0" y="125.0" width="62.0" height="22" rx="5" fill="none" stroke="#6b7590" stroke-opacity="0.8"/>
<text x="129.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8">intra_eu</text>
<text x="174.5" y="140" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-&gt;</text>
