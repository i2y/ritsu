<text x="265.0" y="126" font-size="10.5" font-weight="400" text-anchor="middle" fill="#8e9cff">band</text>
<path d="M355.5,162 V172 A10,10 0 0 0 365.5,182 H796.5 A10,10 0 0 0 806.5,172 V168 A10,10 0 0 1 816.5,158 H828.5" fill="none" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
