<rect x="482.0" y="125.0" width="62.0" height="22" rx="5" fill="none" stroke="#6b7590" stroke-opacity="0.8"/>
<text x="513.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8">distance</text>
<rect x="551.0" y="125.0" width="62.0" height="22" rx="5" fill="none" stroke="#6b7590" stroke-opacity="0.8"/>
