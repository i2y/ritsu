<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 458" width="1184" height="458" role="img" aria-label="An agent binds a rule's table (.rule) to the API contract (a .proto with Protovalidate, OpenAPI or a JSON Schema): shape and from say where in the contract each input comes from, and an import ties an enum to the contract's set of values. Whenever the contract or the rule changes, rulec check in CI holds the two together and returns a field that was renamed, an enum value that was added, and a value the contract lets through that the rule refuses, with that value. Whether the contract or the rule is the side to change is a person's decision." font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
<defs>
<marker id="head-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#6b7590"/></marker>
<marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#8e9cff"/></marker>
<marker id="head-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#e0b45c"/></marker>
</defs>
<path d="M20,20.0 H158 L170,32.0 V120.0 H20 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M158,20.0 V32.0 H170 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="29" y="42.0" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">API contract</text>
<text x="29" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">a .proto, Protovalidate</text>
<text x="29" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">OpenAPI</text>
<text x="29" y="90.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">a JSON Schema</text>
<clipPath id="clip-1"><rect x="266" y="20" width="150" height="196" rx="10"/></clipPath>
<rect x="266" y="20" width="150" height="196" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="266" y="20" width="150" height="5" fill="#8e9cff" clip-path="url(#clip-1)"/>
<text x="341.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">Agent</text>
<text x="341.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">binds the inputs</text>
<text x="341.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">shape and from</text>
<text x="341.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">imports the enums</text>
<path d="M512,20.0 H630 L642,32.0 V120.0 H512 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M630,20.0 V32.0 H642 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="521" y="42.0" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">Table</text>
<text x="633" y="42.0" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="521" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">from order.lines</text>
<text x="521" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">import proto</text>
<clipPath id="clip-3"><rect x="738" y="20" width="160" height="196" rx="10"/></clipPath>
<rect x="738" y="20" width="160" height="196" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="738" y="20" width="160" height="5" fill="#8e9cff" clip-path="url(#clip-3)"/>
<text x="818.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">rulec</text>
<text x="818.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">follows the paths</text>
<text x="818.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">matches the value sets</text>
<text x="818.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">holds the validation</text>
<text x="818.0" y="149" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">to the declarations</text>
<path d="M994,20.0 H1152 L1164,32.0 V120.0 H994 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M1152,20.0 V32.0 H1164 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="1003" y="42.0" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">CI</text>
<text x="1003" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">a renamed field: E121</text>
<text x="1003" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">an added value: E032</text>
<text x="1003" y="90.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">a wider contract: E122</text>
<line x1="170" y1="70" x2="266" y2="70" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="218.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">reads</text>
<line x1="416" y1="70" x2="512" y2="70" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="464.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">binds</text>
<line x1="642" y1="70" x2="738" y2="70" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="690.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rulec check</text>
<text x="690.0" y="88" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">on every change</text>
<line x1="898" y1="70" x2="994" y2="70" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="946.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">stops or passes</text>
<path d="M489.0,132 H653.0 L665.0,144 V212 H489.0 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M653.0,132 V144 H665.0 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="498.0" y="154" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">Mismatch</text>
<text x="498.0" y="172" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">the value, and</text>
<text x="498.0" y="187" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">the annotation to add</text>
<line x1="738" y1="172" x2="665.0" y2="172" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<line x1="489.0" y1="172" x2="416" y2="172" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="577.0" y="227" font-size="11" font-weight="400" text-anchor="middle" fill="#8e9cff">until it agrees</text>
<clipPath id="clip-person"><rect x="733.0" y="290" width="170" height="148" rx="10"/></clipPath>
<rect x="733.0" y="290" width="170" height="148" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="733.0" y="290" width="170" height="5" fill="#e0b45c" clip-path="url(#clip-person)"/>
<text x="818.0" y="333" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">The owners</text>
<text x="818.0" y="362" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">decide whether the</text>
<text x="818.0" y="381" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">contract or the rule</text>
<text x="818.0" y="400" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">is the one to change</text>
<line x1="818.0" y1="216" x2="818.0" y2="290" stroke="#e0b45c" stroke-width="1.8" marker-end="url(#head-human)"/>
<text x="826.0" y="257.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#e0b45c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">E122</text>
</svg>
