<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 750" width="576" height="750" role="img" aria-label="Which joint each of the nine layers watches. Down the left run four things — the business as it is, the document it was copied from, the table as written, and the generated code — each a copy of the one above it. Between the document and the table stands layer 9, the source check (E116, W120); between the table and the code stand layers 4, 5 and 6, the vectors, the coverage criteria and the model checker. The table itself is watched by layers 1, 2 and 3, the five proofs, the two declarations and the examples. At the topmost joint, between the business and the document, there is no layer at all: that is where a person read and decided. Layers 7 and 8, the certificate with its two re-checkers and the repository's own tests, are aimed at the tool rather than at a joint." font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
<defs>
<marker id="head-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#6b7590"/></marker>
<marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#8e9cff"/></marker>
<marker id="head-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#e0b45c"/></marker>
</defs>
<path d="M20,20 H198 L210,32 V84 H20 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M198,20 V32 H210 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="29" y="42" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The business</text>
<text x="29" y="60" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">what you actually mean</text>
<path d="M20,180 H198 L210,192 V244 H20 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M198,180 V192 H210 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="29" y="202" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The document</text>
<text x="29" y="220" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">terms, a tariff, a statute</text>
<path d="M20,340 H198 L210,352 V404 H20 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M198,340 V352 H210 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="29" y="362" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The table</text>
<text x="201" y="362" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="29" y="380" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">rows, columns, ranges</text>
<path d="M20,500 H198 L210,512 V564 H20 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M198,500 V512 H210 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="29" y="522" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The generated code</text>
<text x="201" y="522" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gen</text>
<text x="29" y="540" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">twelve languages</text>
<line x1="115.0" y1="90" x2="115.0" y2="178" stroke="#6b7590" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="115.0" y1="250" x2="115.0" y2="338" stroke="#6b7590" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="115.0" y1="410" x2="115.0" y2="498" stroke="#6b7590" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<clipPath id="clip-c0"><rect x="238" y="36" width="318" height="110" rx="10"/></clipPath>
<rect x="238" y="36" width="318" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="238" y="36" width="318" height="5" fill="#e0b45c" clip-path="url(#clip-c0)"/>
<text x="397.0" y="79" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">No layer here</text>
<text x="397.0" y="108" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">A person read, and wrote it down.</text>
<text x="397.0" y="127" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">rulec sees only from here down</text>
<line x1="232" y1="91.0" x2="115.0" y2="132.0" stroke="#e0b45c" stroke-width="1.8" marker-end="url(#head-human)"/>
<clipPath id="clip-c1"><rect x="238" y="164" width="318" height="110" rx="10"/></clipPath>
<rect x="238" y="164" width="318" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="238" y="164" width="318" height="5" fill="#8e9cff" clip-path="url(#clip-c1)"/>
<text x="397.0" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">9 — the source</text>
<text x="397.0" y="236" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Catches a mistyped amount.</text>
<text x="397.0" y="255" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">@法 別表第一 → E116, W120</text>
<line x1="232" y1="219.0" x2="115.0" y2="292.0" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c2"><rect x="238" y="292" width="318" height="110" rx="10"/></clipPath>
<rect x="238" y="292" width="318" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="238" y="292" width="318" height="5" fill="#8e9cff" clip-path="url(#clip-c2)"/>
<text x="397.0" y="335" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">1, 2, 3 — the table</text>
<text x="397.0" y="364" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Five proofs: gaps, overlaps, dead rows,</text>
<text x="397.0" y="383" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">units, int64. Rounding. Examples.</text>
<line x1="232" y1="347.0" x2="214" y2="372.0" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c3"><rect x="238" y="420" width="318" height="110" rx="10"/></clipPath>
<rect x="238" y="420" width="318" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="238" y="420" width="318" height="5" fill="#8e9cff" clip-path="url(#clip-c3)"/>
<text x="397.0" y="463" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">4, 5, 6 — the code</text>
<text x="397.0" y="492" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Twelve languages, byte for byte. Five</text>
<text x="397.0" y="511" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">coverage criteria. Rust over every input</text>
<line x1="232" y1="475.0" x2="115.0" y2="452.0" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-foot"><rect x="20" y="590" width="536" height="118" rx="10"/></clipPath>
<rect x="20" y="590" width="536" height="118" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="20" y="590" width="536" height="5" fill="#8e9cff" clip-path="url(#clip-foot)"/>
<text x="288.0" y="633" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">7, 8 — the tool itself</text>
<text x="288.0" y="662" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Not a joint: the side that produces the rest. Evidence read back by two</text>
<text x="288.0" y="681" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">programs sharing no code with it; 83 rules broken on purpose, each held to its code</text>
<text x="288.0" y="734" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8">A rule that cites no document has no second box, and what nothing reaches widens to the table itself.</text>
</svg>
