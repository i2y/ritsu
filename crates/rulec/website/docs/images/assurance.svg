<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 868" width="576" height="868" role="img" aria-label="What each of the nine layers stands between. Down the left run the business as it is, the document it was copied from, the table as written, and the generated code, each a copy of the one above it. The table produces one more thing, the certificate (cert.json, what the five proofs rest on), joined to it by a line that runs down the left margin. Between the document and the table stands layer 9, the source check (E116, W120); between the table and the code stand layers 4, 5 and 6, the vectors, the coverage criteria and the model checker. The table itself is watched by layers 1, 2 and 3; the certificate is read back by layer 7, two programs that share no code with rulec. At the topmost joint, between the business and the document, there is no layer at all: that is where a person read and decided. Only layer 8, the repository's own tests, is aimed at the tool rather than at anything on the spine." font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
<defs>
<marker id="head-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#6b7590"/></marker>
<marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#8e9cff"/></marker>
<marker id="head-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#e0b45c"/></marker>
</defs>
<path d="M44,20 H222 L234,32 V84 H44 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M222,20 V32 H234 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="53" y="42" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The business</text>
<text x="53" y="60" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">what you actually mean</text>
<path d="M44,170 H222 L234,182 V234 H44 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M222,170 V182 H234 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="53" y="192" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The document</text>
<text x="53" y="210" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">terms, a tariff, a statute</text>
<path d="M44,320 H222 L234,332 V384 H44 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M222,320 V332 H234 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="53" y="342" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The table</text>
<text x="225" y="342" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="53" y="360" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">rows, columns, ranges</text>
<path d="M44,470 H222 L234,482 V534 H44 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M222,470 V482 H234 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="53" y="492" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The generated code</text>
<text x="225" y="492" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gen</text>
<text x="53" y="510" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">twelve languages</text>
<path d="M44,620 H222 L234,632 V684 H44 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M222,620 V632 H234 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="53" y="642" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">The certificate</text>
<text x="225" y="642" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cert.json</text>
<text x="53" y="660" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">what the five proofs rest on</text>
<line x1="139.0" y1="90" x2="139.0" y2="168" stroke="#6b7590" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="139.0" y1="240" x2="139.0" y2="318" stroke="#6b7590" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="139.0" y1="390" x2="139.0" y2="468" stroke="#6b7590" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<path d="M42,352.0 H22 V652.0 H36" fill="none" stroke="#6b7590" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head-neutral)"/>
<clipPath id="clip-c0"><rect x="252" y="36" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="36" width="304" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="252" y="36" width="304" height="5" fill="#e0b45c" clip-path="url(#clip-c0)"/>
<text x="404.0" y="79" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">No layer here</text>
<text x="404.0" y="108" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">A person read, and wrote it down.</text>
<text x="404.0" y="127" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">rulec sees only from here down</text>
<line x1="246" y1="91.0" x2="139.0" y2="127.0" stroke="#e0b45c" stroke-width="1.8" marker-end="url(#head-human)"/>
<clipPath id="clip-c1"><rect x="252" y="164" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="164" width="304" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="252" y="164" width="304" height="5" fill="#8e9cff" clip-path="url(#clip-c1)"/>
<text x="404.0" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">9 — the source</text>
<text x="404.0" y="236" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Catches a mistyped amount.</text>
<text x="404.0" y="255" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">@法 別表第一 → E116, W120</text>
<line x1="246" y1="219.0" x2="139.0" y2="277.0" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c2"><rect x="252" y="292" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="292" width="304" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="252" y="292" width="304" height="5" fill="#8e9cff" clip-path="url(#clip-c2)"/>
<text x="404.0" y="335" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">1, 2, 3 — the table</text>
<text x="404.0" y="364" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Five proofs: gaps, overlaps, dead rows,</text>
<text x="404.0" y="383" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">units, int64. Rounding. Examples.</text>
<line x1="246" y1="347.0" x2="238" y2="352.0" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c3"><rect x="252" y="420" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="420" width="304" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="252" y="420" width="304" height="5" fill="#8e9cff" clip-path="url(#clip-c3)"/>
<text x="404.0" y="463" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">4, 5, 6 — the code</text>
<text x="404.0" y="492" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Twelve languages, byte for byte. Five</text>
<text x="404.0" y="511" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">coverage criteria. Rust over every input</text>
<line x1="246" y1="475.0" x2="139.0" y2="427.0" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c4"><rect x="252" y="548" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="548" width="304" height="110" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="252" y="548" width="304" height="5" fill="#8e9cff" clip-path="url(#clip-c4)"/>
<text x="404.0" y="591" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">7 — the evidence, re-read</text>
<text x="404.0" y="620" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">Two programs share no code with rulec:</text>
<text x="404.0" y="639" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">one file with no imports, and Lean's proofs</text>
<line x1="246" y1="603.0" x2="238" y2="652.0" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-foot"><rect x="44" y="710" width="488" height="118" rx="10"/></clipPath>
<rect x="44" y="710" width="488" height="118" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="44" y="710" width="488" height="5" fill="#8e9cff" clip-path="url(#clip-foot)"/>
<text x="288.0" y="753" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">8 — the tool itself, tried</text>
<text x="288.0" y="782" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">The layers above come out of rulec's implementation, which is not proved correct.</text>
<text x="288.0" y="801" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">83 rules broken on purpose hold it to its diagnostics; 33 run in every language</text>
<text x="288.0" y="852" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8">A rule that cites no document has no second box, and what nothing reaches widens to the table itself.</text>
</svg>
