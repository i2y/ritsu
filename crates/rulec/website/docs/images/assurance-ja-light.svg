<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 868" width="576" height="868" role="img" aria-label="九つの層が、何と何のあいだを見張っているか。上から順に 現実の業務 → 写した文書 → 書かれた表 → 生成コード が並び、隣どうしは写しの関係にある。書かれた表からはもう一つ、証明書（cert.json、五つの証明の中身）が出ていて、左を回る線で表とつながっている。写した文書と書かれた表のあいだは 9 出典（E116・E119・W120）が、書かれた表と生成コードのあいだは 4 ベクタ・5 網羅・6 モデル検査器が見張る。書かれた表そのものは 1 五つの証明・2 二つの宣言・3 例 が見て、証明書は 7 二つの再検査器が読み直す。いちばん上、現実の業務と写した文書のあいだには層が一つも無く、そこは人が読んで決めるところ。8 リポジトリのテストだけは継ぎ目ではなく、道具そのものに向いている。" font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
<defs>
<marker id="head-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#8b94ab"/></marker>
<marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#4457d8"/></marker>
<marker id="head-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#9c6508"/></marker>
</defs>
<path d="M44,20 H222 L234,32 V84 H44 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M222,20 V32 H234 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="53" y="42" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">現実の業務</text>
<text x="53" y="60" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">決めたいことそのもの</text>
<path d="M44,170 H222 L234,182 V234 H44 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M222,170 V182 H234 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="53" y="192" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">写した文書</text>
<text x="53" y="210" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">規約、料金表、法令</text>
<path d="M44,320 H222 L234,332 V384 H44 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M222,320 V332 H234 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="53" y="342" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">書かれた表</text>
<text x="225" y="342" font-size="9.5" font-weight="400" text-anchor="end" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="53" y="360" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">行と列、宣言した範囲</text>
<path d="M44,470 H222 L234,482 V534 H44 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M222,470 V482 H234 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="53" y="492" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">生成コード</text>
<text x="225" y="492" font-size="9.5" font-weight="400" text-anchor="end" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gen</text>
<text x="53" y="510" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">12 言語と、その呼び方</text>
<path d="M44,620 H222 L234,632 V684 H44 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M222,620 V632 H234 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="53" y="642" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">証明書</text>
<text x="225" y="642" font-size="9.5" font-weight="400" text-anchor="end" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cert.json</text>
<text x="53" y="660" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">五つの証明の中身</text>
<line x1="139.0" y1="90" x2="139.0" y2="168" stroke="#8b94ab" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="139.0" y1="240" x2="139.0" y2="318" stroke="#8b94ab" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="139.0" y1="390" x2="139.0" y2="468" stroke="#8b94ab" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<path d="M42,352.0 H22 V652.0 H36" fill="none" stroke="#8b94ab" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head-neutral)"/>
<clipPath id="clip-c0"><rect x="252" y="36" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="36" width="304" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="252" y="36" width="304" height="5" fill="#9c6508" clip-path="url(#clip-c0)"/>
<text x="404.0" y="79" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">層がありません</text>
<text x="404.0" y="108" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">人が読んで書いたところ。rulec が</text>
<text x="404.0" y="127" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">見るのは、ここから下だけ</text>
<line x1="246" y1="91.0" x2="139.0" y2="127.0" stroke="#9c6508" stroke-width="1.8" marker-end="url(#head-human)"/>
<clipPath id="clip-c1"><rect x="252" y="164" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="164" width="304" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="252" y="164" width="304" height="5" fill="#4457d8" clip-path="url(#clip-c1)"/>
<text x="404.0" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">9 — 出典を見る</text>
<text x="404.0" y="236" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">写し間違いを捕まえる。</text>
<text x="404.0" y="255" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">@法 別表第一 → E116・E119・W120</text>
<line x1="246" y1="219.0" x2="139.0" y2="277.0" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c2"><rect x="252" y="292" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="292" width="304" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="252" y="292" width="304" height="5" fill="#4457d8" clip-path="url(#clip-c2)"/>
<text x="404.0" y="335" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">1・2・3 — 表を見る</text>
<text x="404.0" y="364" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">五つの証明（抜け、重なり、当たらない</text>
<text x="404.0" y="383" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">行、単位、int64）。丸めの宣言と、例</text>
<line x1="246" y1="347.0" x2="238" y2="352.0" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c3"><rect x="252" y="420" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="420" width="304" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="252" y="420" width="304" height="5" fill="#4457d8" clip-path="url(#clip-c3)"/>
<text x="404.0" y="463" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">4・5・6 — コードを見る</text>
<text x="404.0" y="492" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">12 言語が一バイトずつ一致。網羅の五基準。</text>
<text x="404.0" y="511" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">モデル検査器は Rust を全入力で読む</text>
<line x1="246" y1="475.0" x2="139.0" y2="427.0" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c4"><rect x="252" y="548" width="304" height="110" rx="10"/></clipPath>
<rect x="252" y="548" width="304" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="252" y="548" width="304" height="5" fill="#4457d8" clip-path="url(#clip-c4)"/>
<text x="404.0" y="591" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">7 — 証拠を読み直す</text>
<text x="404.0" y="620" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">rulec とコードを共有しない二つが読む。</text>
<text x="404.0" y="639" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">依存ゼロの一ファイルと、Lean の証明つき</text>
<line x1="246" y1="603.0" x2="238" y2="652.0" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-foot"><rect x="44" y="710" width="488" height="118" rx="10"/></clipPath>
<rect x="44" y="710" width="488" height="118" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="44" y="710" width="488" height="5" fill="#4457d8" clip-path="url(#clip-foot)"/>
<text x="288.0" y="753" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">8 — 道具そのものを試す</text>
<text x="288.0" y="782" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">ここまでの層を出しているのは rulec の実装で、その正しさは証明していません。</text>
<text x="288.0" y="801" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">わざと壊した 96 本が狙った診断を出し、48 本の規則が毎コミット全言語で走る</text>
<text x="288.0" y="852" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6478">出典を引いていない規則には、上から二つめの箱がありません。届かない範囲が表まで広がります。</text>
</svg>
