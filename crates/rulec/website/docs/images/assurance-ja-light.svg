<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 750" width="576" height="750" role="img" aria-label="九つの層が、どの継ぎ目を見張っているか。上から順に 現実の業務 → 写した文書 → 書かれた表 → 生成コード の四つが並び、隣どうしは写しの関係にある。写した文書と書かれた表のあいだは 9 出典（E116・W120）が、書かれた表と生成コードのあいだは 4 ベクタ・5 網羅・6 モデル検査器が見張る。書かれた表そのものは 1 五つの証明・2 二つの宣言・3 例 が見る。いちばん上、現実の業務と写した文書のあいだには層が一つも無く、そこは人が読んで決めるところ。7 証明書と二つの再検査器、8 リポジトリのテストは継ぎ目ではなく、道具そのものに向いている。" font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
<defs>
<marker id="head-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#8b94ab"/></marker>
<marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#4457d8"/></marker>
<marker id="head-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#9c6508"/></marker>
</defs>
<path d="M20,20 H198 L210,32 V84 H20 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M198,20 V32 H210 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="29" y="42" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">現実の業務</text>
<text x="29" y="60" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">決めたいことそのもの</text>
<path d="M20,180 H198 L210,192 V244 H20 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M198,180 V192 H210 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="29" y="202" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">写した文書</text>
<text x="29" y="220" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">規約、料金表、法令</text>
<path d="M20,340 H198 L210,352 V404 H20 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M198,340 V352 H210 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="29" y="362" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">書かれた表</text>
<text x="201" y="362" font-size="9.5" font-weight="400" text-anchor="end" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="29" y="380" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">行と列、宣言した範囲</text>
<path d="M20,500 H198 L210,512 V564 H20 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M198,500 V512 H210 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="29" y="522" font-size="13" font-weight="600" text-anchor="start" fill="#10131a">生成コード</text>
<text x="201" y="522" font-size="9.5" font-weight="400" text-anchor="end" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gen</text>
<text x="29" y="540" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6478">12 言語と、その呼び方</text>
<line x1="115.0" y1="90" x2="115.0" y2="178" stroke="#8b94ab" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="115.0" y1="250" x2="115.0" y2="338" stroke="#8b94ab" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="115.0" y1="410" x2="115.0" y2="498" stroke="#8b94ab" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<clipPath id="clip-c0"><rect x="238" y="36" width="318" height="110" rx="10"/></clipPath>
<rect x="238" y="36" width="318" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="238" y="36" width="318" height="5" fill="#9c6508" clip-path="url(#clip-c0)"/>
<text x="397.0" y="79" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">層がありません</text>
<text x="397.0" y="108" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">人が読んで書いたところ。rulec が</text>
<text x="397.0" y="127" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">見るのは、ここから下だけ</text>
<line x1="232" y1="91.0" x2="115.0" y2="132.0" stroke="#9c6508" stroke-width="1.8" marker-end="url(#head-human)"/>
<clipPath id="clip-c1"><rect x="238" y="164" width="318" height="110" rx="10"/></clipPath>
<rect x="238" y="164" width="318" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="238" y="164" width="318" height="5" fill="#4457d8" clip-path="url(#clip-c1)"/>
<text x="397.0" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">9 — 出典を見る</text>
<text x="397.0" y="236" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">写し間違いを捕まえる。</text>
<text x="397.0" y="255" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">@法 別表第一 → E116・W120</text>
<line x1="232" y1="219.0" x2="115.0" y2="292.0" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c2"><rect x="238" y="292" width="318" height="110" rx="10"/></clipPath>
<rect x="238" y="292" width="318" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="238" y="292" width="318" height="5" fill="#4457d8" clip-path="url(#clip-c2)"/>
<text x="397.0" y="335" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">1・2・3 — 表を見る</text>
<text x="397.0" y="364" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">五つの証明（抜け、重なり、当たらない</text>
<text x="397.0" y="383" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">行、単位、int64）。丸めの宣言と、例</text>
<line x1="232" y1="347.0" x2="214" y2="372.0" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-c3"><rect x="238" y="420" width="318" height="110" rx="10"/></clipPath>
<rect x="238" y="420" width="318" height="110" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="238" y="420" width="318" height="5" fill="#4457d8" clip-path="url(#clip-c3)"/>
<text x="397.0" y="463" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">4・5・6 — コードを見る</text>
<text x="397.0" y="492" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">12 言語が一バイトずつ一致。網羅の五基準。</text>
<text x="397.0" y="511" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">モデル検査器は Rust を全入力で読む</text>
<line x1="232" y1="475.0" x2="115.0" y2="452.0" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<clipPath id="clip-foot"><rect x="20" y="590" width="536" height="118" rx="10"/></clipPath>
<rect x="20" y="590" width="536" height="118" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<rect x="20" y="590" width="536" height="5" fill="#4457d8" clip-path="url(#clip-foot)"/>
<text x="288.0" y="633" font-size="17" font-weight="700" text-anchor="middle" fill="#10131a">7・8 — 道具そのものを見る</text>
<text x="288.0" y="662" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">継ぎ目ではなく、上の層を出している道具そのものへ。渡せる証拠を、</text>
<text x="288.0" y="681" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b6478">コードを共有しない二つが読み直す。わざと壊した 83 本が診断を確かめる</text>
<text x="288.0" y="734" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6478">出典を引いていない規則には、上から二つめの箱がありません。届かない範囲が表まで広がります。</text>
</svg>
