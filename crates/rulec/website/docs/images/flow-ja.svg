<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="エージェントは規約や Excel を読んで表（.rule）を書き、rulec check にかける。rulec は診断（どこが・どう直すか・それを起こす入力）を返し、道具では決められないことは具体例つきの質問として人に渡る。人は金額と丸めの向きだけを決める。表が通ったら rulec gen が依存ゼロの Python と Go を出す。" font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4a5468"/></marker><marker id="headA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8e9cff"/></marker></defs>
<rect x="24" y="64" width="126" height="132" rx="12" fill="#12151c" stroke="#242a37"/>
<text x="87.0" y="116" font-size="12" font-weight="400" text-anchor="middle" fill="#98a1b8">規約の文書</text>
<text x="87.0" y="131" font-size="12" font-weight="400" text-anchor="middle" fill="#98a1b8">Excel</text>
<text x="87.0" y="146" font-size="12" font-weight="400" text-anchor="middle" fill="#98a1b8">旧実装</text>
<rect x="238" y="64" width="210" height="132" rx="12" fill="#171b24" stroke="#2b3242"/>
<text x="343.0" y="91" font-size="16.5" font-weight="700" text-anchor="middle" fill="#e8ebf4">エージェント</text>
<text x="343.0" y="111" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8">読んで書く・直す</text>
<line x1="252" y1="124" x2="434" y2="124" stroke="#2b3242" stroke-width="1"/>
<text x="252" y="144" font-size="10.5" text-anchor="start" fill="#8e9cff">入<tspan dx="7" font-size="11" fill="#98a1b8">規約・診断・人の答え</tspan></text>
<text x="252" y="165" font-size="10.5" text-anchor="start" fill="#8e9cff">出<tspan dx="7" font-size="11" fill="#98a1b8">表（.rule）</tspan></text>
<rect x="536" y="64" width="210" height="132" rx="12" fill="#171b24" stroke="#2b3242"/>
<text x="641.0" y="91" font-size="16.5" font-weight="700" text-anchor="middle" fill="#e8ebf4">rulec</text>
<text x="641.0" y="111" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8">7 つを証明する</text>
<line x1="550" y1="124" x2="732" y2="124" stroke="#2b3242" stroke-width="1"/>
<text x="550" y="144" font-size="10.5" text-anchor="start" fill="#8e9cff">入<tspan dx="7" font-size="11" fill="#98a1b8">表（.rule）</tspan></text>
<text x="550" y="165" font-size="10.5" text-anchor="start" fill="#8e9cff">出<tspan dx="7" font-size="11" fill="#98a1b8">診断・生成物</tspan></text>
<rect x="550" y="300" width="240" height="132" rx="12" fill="#171b24" stroke="#2b3242"/>
<text x="670.0" y="327" font-size="16.5" font-weight="700" text-anchor="middle" fill="#e8ebf4">人</text>
<text x="670.0" y="347" font-size="11" font-weight="400" text-anchor="middle" fill="#98a1b8">業務の判断だけをする</text>
<line x1="564" y1="360" x2="776" y2="360" stroke="#2b3242" stroke-width="1"/>
<text x="564" y="380" font-size="10.5" text-anchor="start" fill="#8e9cff">入<tspan dx="7" font-size="11" fill="#98a1b8">具体例つきの質問</tspan></text>
<text x="564" y="401" font-size="10.5" text-anchor="start" fill="#8e9cff">出<tspan dx="7" font-size="11" fill="#98a1b8">答え・承認</tspan></text>
<rect x="834" y="64" width="142" height="132" rx="12" fill="#171b24" stroke="#2b3242"/>
<text x="905.0" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#e8ebf4">Python と Go</text>
<text x="905.0" y="136" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">依存ゼロの関数</text>
<text x="905.0" y="151" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">両言語で同じ答え</text>
<line x1="156" y1="130" x2="232" y2="130" stroke="#4a5468" stroke-width="1.8" marker-end="url(#head)"/>
<text x="194.0" y="120" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">読む</text>
<line x1="454" y1="130" x2="530" y2="130" stroke="#4a5468" stroke-width="1.8" marker-end="url(#head)"/>
<text x="492.0" y="104" font-size="10" font-weight="400" text-anchor="middle" fill="#c3cae0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>rulec check</text>
<text x="492.0" y="120" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">① 表（.rule）</text>
<line x1="752" y1="130" x2="828" y2="130" stroke="#4a5468" stroke-width="1.8" marker-end="url(#head)"/>
<text x="790.0" y="104" font-size="10" font-weight="400" text-anchor="middle" fill="#c3cae0" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>rulec gen</text>
<text x="790.0" y="120" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">⑤ 生成物</text>
<path d="M 580 196 V 242 H 340 V 202" fill="none" stroke="#8e9cff" stroke-width="1.6" marker-end="url(#headA)"/>
<text x="460.0" y="218" font-size="11" font-weight="400" text-anchor="middle" fill="#8e9cff">② 診断 ＝ どこが・どう直すか・</text>
<text x="460.0" y="233" font-size="11" font-weight="400" text-anchor="middle" fill="#8e9cff">それを起こす入力 → 直して ① へ</text>
<path d="M 680 196 V 294" fill="none" stroke="#8e9cff" stroke-width="1.6" marker-end="url(#headA)"/>
<text x="694" y="230" font-size="11" font-weight="400" text-anchor="start" fill="#8e9cff">③ 道具では決められないこと</text>
<text x="694" y="245" font-size="11" font-weight="400" text-anchor="start" fill="#8e9cff">＝ 具体例つきの質問</text>
<path d="M 550 366 H 300 V 202" fill="none" stroke="#8e9cff" stroke-width="1.6" marker-end="url(#headA)"/>
<text x="425.0" y="342" font-size="11" font-weight="400" text-anchor="middle" fill="#8e9cff">④ 答え（金額・丸めの向き）</text>
<text x="425.0" y="357" font-size="11" font-weight="400" text-anchor="middle" fill="#8e9cff">→ 表に書いて ① へ</text>
<text x="24" y="470" font-size="12" font-weight="400" text-anchor="start" fill="#98a1b8">このループが終わったとき、手に入るもの</text>
<rect x="24" y="482" width="952" height="88" rx="12" fill="#12151c" stroke="#242a37"/>
<text x="182.66666666666666" y="518" font-size="14" font-weight="700" text-anchor="middle" fill="#e8ebf4">抜けも矛盾もない表</text>
<text x="182.66666666666666" y="540" font-size="11.5" font-weight="400" text-anchor="middle" fill="#98a1b8">人が承認できる形で</text>
<text x="500.0" y="518" font-size="14" font-weight="700" text-anchor="middle" fill="#e8ebf4">証明済みの Python と Go</text>
<text x="500.0" y="540" font-size="11.5" font-weight="400" text-anchor="middle" fill="#98a1b8">依存ゼロ・両言語で同じ答え</text>
<line x1="341.3333333333333" y1="500" x2="341.3333333333333" y2="552" stroke="#242a37" stroke-width="1"/>
<text x="817.3333333333333" y="518" font-size="14" font-weight="700" text-anchor="middle" fill="#e8ebf4">入れる前に分かる影響</text>
<text x="817.3333333333333" y="540" font-size="11.5" font-weight="400" text-anchor="middle" fill="#98a1b8">何件が、いくら動くか</text>
<line x1="658.6666666666666" y1="500" x2="658.6666666666666" y2="552" stroke="#242a37" stroke-width="1"/>
</svg>
