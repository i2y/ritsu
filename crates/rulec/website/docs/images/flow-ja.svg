<text x="29" y="60" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">規約の文書</text>
<text x="29" y="75" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">Excel</text>
<text x="29" y="90" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">旧実装</text>
<path d="M410,45 H510 L522,57 V95 H410 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M510,45 V57 H522 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="419" y="67" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">表</text>
<text x="513" y="67" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="419" y="85" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">1 規則 = 1 表</text>
<path d="M391,122 H529 L541,134 V202 H391 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M529,122 V134 H541 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="400" y="144" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">診断</text>
<text x="532" y="144" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">JSON</text>
<text x="400" y="162" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">どこが</text>
<text x="400" y="177" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">どう直すか</text>
<text x="400" y="192" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">それを起こす入力</text>
<path d="M860,20 H968 L980,32 V120 H860 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M968,20 V32 H980 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="869" y="42" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">Python と Go</text>
<text x="869" y="60" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">証明済み</text>
<text x="869" y="75" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">依存ゼロ</text>
<text x="869" y="90" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">両言語で同じ答え</text>
<path d="M601,271 H759 L771,283 V341 H601 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M759,271 V283 H771 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="610" y="293" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">具体例つきの質問</text>
<text x="610" y="311" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">「山梨県あての S60 の</text>
<text x="610" y="326" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">運賃はいくらですか」</text>
<path d="M176,271 H304 L316,283 V341 H176 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M304,271 V283 H316 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="185" y="293" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">答え</text>
<text x="185" y="311" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">金額</text>
<text x="185" y="326" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">丸めの向き</text>
