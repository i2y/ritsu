<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="エージェントが資料を読んで表（.rule）を書き、rulec check にかける。rulec は診断（どこが・どう直すか・それを起こす入力）を返し、エージェントが直して、表が通るまで繰り返す。道具では決められないことだけが具体例つきの質問として人に渡り、人は金額と丸めの向きを答える。表が通ると rulec gen が証明済みの Python と Go を出す。" font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
<defs>
<marker id="head-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#6b7590"/></marker>
<marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#8e9cff"/></marker>
<marker id="head-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#e0b45c"/></marker>
</defs>
<clipPath id="clip-agent"><rect x="166" y="20" width="160" height="196" rx="10"/></clipPath>
<rect x="166" y="20" width="160" height="196" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="166" y="20" width="160" height="5" fill="#8e9cff" clip-path="url(#clip-agent)"/>
<text x="246.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">エージェント</text>
<text x="246.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">資料を読む</text>
<text x="246.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">表を書く</text>
<text x="246.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">診断のとおりに直す</text>
<text x="246.0" y="149" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">決められないことは人へ</text>
<clipPath id="clip-rulec"><rect x="606" y="20" width="160" height="196" rx="10"/></clipPath>
<rect x="606" y="20" width="160" height="196" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="606" y="20" width="160" height="5" fill="#8e9cff" clip-path="url(#clip-rulec)"/>
<text x="686.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">rulec</text>
<text x="686.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">7 つを証明する：</text>
<text x="686.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">完全性・重なり</text>
<text x="686.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">当たらない行・単位</text>
<text x="686.0" y="149" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">丸め・オーバーフロー</text>
<text x="686.0" y="168" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">例が通ること</text>
<clipPath id="clip-person"><rect x="375" y="232" width="170" height="148" rx="10"/></clipPath>
<rect x="375" y="232" width="170" height="148" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="375" y="232" width="170" height="5" fill="#e0b45c" clip-path="url(#clip-person)"/>
<text x="460.0" y="275" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">人</text>
<text x="460.0" y="304" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">金額を決める</text>
<text x="460.0" y="323" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">丸めの向きを決める</text>
<text x="460.0" y="342" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">表を承認する</text>
<text x="460.0" y="361" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">コードは書かない</text>
