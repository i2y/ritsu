<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="rulec">
  <!-- A decision table: three rows, each a condition and an output cell.
       The badge is the proof that every one of them is covered. -->
