<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124 458" width="1124" height="458" role="img" aria-label="社内の規程や自社サービスの規約、Excel、動いているコードといった手元のものを、エージェントが表（.rule）に写す。Excel からは rulec import で下書きを起こし、文書は @ で引用してファイルごとハッシュを固定する。rulec が抜けと重なりを証明し、旧実装や過去の記録と突き合わせて、食い違いをどの行で何件いくらかで返す。承認する人は rulec doc の資料で文書と表を見比べる。通った表から九言語に生成する。" font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
