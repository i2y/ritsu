<line x1="151.0" y1="136" x2="197.0" y2="136" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="174.0" y="126" font-size="10.5" font-weight="400" text-anchor="middle" fill="#4457d8">区分</text>
<line x1="390.0" y1="136" x2="436.0" y2="136" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="413.0" y="126" font-size="10.5" font-weight="400" text-anchor="middle" fill="#4457d8">帯</text>
<line x1="665.0" y1="136" x2="735.0" y2="136" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="700.0" y="126" font-size="10.5" font-weight="400" text-anchor="middle" fill="#4457d8">送料 倍率</text>
<path d="M739.0,84 H971.8 L983.8,96 V162 H739.0 Z" fill="#f5f6fa" stroke="#cdd3e2" stroke-linejoin="round"/>
<path d="M971.8,84 V96 H983.8 Z" fill="#e3e7f1" stroke="#cdd3e2" stroke-linejoin="round"/>
<text x="748.0" y="116" font-size="10.5" font-weight="400" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">result 請求額 = max(支払額, 0円) + 送料</text>
<text x="748.0" y="136" font-size="10.5" font-weight="400" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">define 付与点 = 基本点 × 倍率</text>
<text x="748.0" y="186" font-size="9.5" font-weight="400" text-anchor="start" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">outputs</text>
<rect x="748.0" y="196" width="51.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="773.5" y="211.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">請求額</text>
<rect x="806.0" y="196" width="51.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="831.5" y="211.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">付与点</text>
<line x1="754.0" y1="164" x2="754.0" y2="172" stroke="#4457d8" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="20" y="238" font-size="10.5" font-weight="400" text-anchor="start" fill="#5b6478">A filled column is a value an earlier step produced</text>
</svg>
