<text x="29" y="108" font-size="11.5" font-weight="600" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">table 重さ判定</text>
<rect x="29" y="125.0" width="40.0" height="22" rx="5" fill="none" stroke="#8b94ab" stroke-opacity="0.8"/>
<text x="49.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6478">重量</text>
<text x="83.5" y="140" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-&gt;</text>
<rect x="98.0" y="125.0" width="40.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="118.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">区分</text>
<rect x="201.0" y="84" width="185.0" height="78" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<text x="210.0" y="108" font-size="11.5" font-weight="600" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">table 帯判定</text>
<rect x="210.0" y="125.0" width="40.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="230.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">区分</text>
<rect x="257.0" y="125.0" width="62.0" height="22" rx="5" fill="none" stroke="#8b94ab" stroke-opacity="0.8"/>
<text x="288.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6478">会員区分</text>
<text x="333.5" y="140" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-&gt;</text>
<rect x="348.0" y="125.0" width="29.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="362.5" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">帯</text>
<rect x="440.0" y="84" width="221.0" height="78" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
<text x="449.0" y="108" font-size="11.5" font-weight="600" text-anchor="start" fill="#10131a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">table 送料表</text>
<rect x="449.0" y="125.0" width="29.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="463.5" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">帯</text>
<rect x="485.0" y="125.0" width="51.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="510.5" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">支払額</text>
<text x="550.5" y="140" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-&gt;</text>
<rect x="565.0" y="125.0" width="40.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="585.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">送料</text>
<rect x="612.0" y="125.0" width="40.0" height="22" rx="5" fill="#4457d8" fill-opacity="0.18" stroke="#4457d8" stroke-opacity="0.8"/>
<text x="632.0" y="140.0" font-size="11" font-weight="400" text-anchor="middle" fill="#10131a">倍率</text>
<text x="29" y="62" font-size="10.5" font-weight="400" text-anchor="start" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">重量</text>
<text x="210.0" y="62" font-size="10.5" font-weight="400" text-anchor="start" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">会員区分</text>
<text x="449.0" y="49" font-size="9.5" font-weight="400" text-anchor="start" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">derived</text>
<text x="449.0" y="62" font-size="10.5" font-weight="400" text-anchor="start" fill="#5b6478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">derive 支払額 = 商品合計 - 値引</text>
<line x1="35" y1="69" x2="35" y2="80" stroke="#8b94ab" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<line x1="216.0" y1="69" x2="216.0" y2="80" stroke="#8b94ab" stroke-width="1.8" marker-end="url(#head-neutral)"/>
