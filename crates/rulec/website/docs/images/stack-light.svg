<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003.8 252" role="img" aria-label="Tables stack as deep as needed. 重さ判定 turns 重量 into 区分, which is a column of 帯判定; the 帯 it produces is a column of 送料表. The derived 支払額 comes in as a column too, and the last table produces 送料 and 倍率 at once, which become 請求額 and 付与点. A filled column is a value an earlier step produced." font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
<defs>
<marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#4457d8"/></marker>
<marker id="head-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#8b94ab"/></marker>
</defs>
<text x="20" y="30" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b6478">会員特典.rule - one rule: three tables stacked, two outputs returned</text>
