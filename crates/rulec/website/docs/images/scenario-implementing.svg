<text x="29" y="42.0" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">Table</text>
<text x="161" y="42.0" font-size="9.5" font-weight="400" text-anchor="end" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.rule</text>
<text x="29" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">a rule that passed check</text>
<clipPath id="clip-1"><rect x="266" y="20" width="160" height="196" rx="10"/></clipPath>
<rect x="266" y="20" width="160" height="196" rx="10" fill="#171b24" stroke="#2b3242"/>
<rect x="266" y="20" width="160" height="5" fill="#8e9cff" clip-path="url(#clip-1)"/>
<text x="346.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">rulec</text>
<text x="346.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">emits nine languages</text>
<text x="346.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">holds each to the</text>
<text x="346.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">reference evaluator</text>
<text x="346.0" y="149" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">lists how to call it</text>
<path d="M522,20.0 H686 L698,32.0 V120.0 H522 Z" fill="#1e2331" stroke="#3a4257" stroke-linejoin="round"/>
<path d="M686,20.0 V32.0 H698 Z" fill="#2b3242" stroke="#3a4257" stroke-linejoin="round"/>
<text x="531" y="42.0" font-size="13" font-weight="600" text-anchor="start" fill="#e8ebf4">Generated code</text>
<text x="531" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">functions (seven languages)</text>
<text x="531" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">one SQL query</text>
<text x="531" y="90.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">one Wasm module</text>
<text x="531" y="105.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">an MCP server</text>
