<line x1="426" y1="70" x2="522" y2="70" stroke="#8e9cff" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="474.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rulec test</text>
<text x="474.0" y="88" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">one answer, nine</text>
<line x1="698" y1="70" x2="794" y2="70" stroke="#6b7590" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<text x="746.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rulec api</text>
<text x="746.0" y="88" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">how to call it</text>
<line x1="944" y1="70" x2="1040" y2="70" stroke="#6b7590" stroke-width="1.8" marker-end="url(#head-neutral)"/>
<text x="992.0" y="61" font-size="10.5" font-weight="400" text-anchor="middle" fill="#98a1b8">wires it in</text>
</svg>
