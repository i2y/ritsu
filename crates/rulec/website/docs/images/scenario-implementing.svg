<text x="1049" y="60.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">an app, a batch</text>
<text x="1049" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">an agent's tool</text>
<text x="1049" y="90.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#98a1b8">a browser</text>
