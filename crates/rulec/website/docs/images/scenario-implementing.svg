<rect x="794" y="20" width="150" height="5" fill="#e0b45c" clip-path="url(#clip-3)"/>
<text x="869.0" y="63" font-size="17" font-weight="700" text-anchor="middle" fill="#e8ebf4">Implementer</text>
<text x="869.0" y="92" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">writes the caller</text>
<text x="869.0" y="111" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">never edits the output</text>
<text x="869.0" y="130" font-size="12.5" font-weight="400" text-anchor="middle" fill="#98a1b8">puts it in CI</text>
