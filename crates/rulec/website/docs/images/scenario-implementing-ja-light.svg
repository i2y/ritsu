<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 236" width="1152" height="236" role="img" aria-label="検査を通った表（.rule）から rulec gen が12 言語のコードを出し、rulec test が参照評価器と突き合わせる。実装する人は rulec api で呼び方を読み、関数・SQL・Wasm・MCP サーバのどれかを自分のアプリやバッチやエージェントに組み込む。生成物は編集せず、表が変われば CI の gen --check が止める。" font-family='-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, "Segoe UI", Roboto, sans-serif'>
