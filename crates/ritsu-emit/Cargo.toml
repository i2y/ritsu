[package]
name = "ritsu-emit"
version.workspace = true
edition = "2024"
# src/xid.rs and src/normal_table.rs are made from the Unicode Character Database (THIRD_PARTY_NOTICES,
# tools/xid/README.md, tools/normal/make_table.py).
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
repository.workspace = true
description = "What the generators of ritsu share about the languages they write: the words each will not take as a name, how a name is made, how a string is written, and the line that says a file is generated"
publish = false

# ritsu-base and std (DESIGN 3.1).
[dependencies]
ritsu-base = { path = "../ritsu-base" }

[dev-dependencies]
ritsu-testkit = { path = "../ritsu-testkit" }
