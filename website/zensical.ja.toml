[project]
site_name = "ritsu"
site_url = "https://i2y.github.io/ritsu/ja/"
site_description = "七つの小さな言語を、一つの処理系で。ある言語が確かめたことを、隣の言語が前提にできる。"
site_author = "Yasushi Itoh"
copyright = "Copyright &copy; 2026 Yasushi Itoh"

repo_url = "https://github.com/i2y/ritsu"
repo_name = "i2y/ritsu"
edit_uri = "edit/main/website/docs-ja"

docs_dir = "docs-ja"
site_dir = "build/ja"
use_directory_urls = true

nav = [
  { "ホーム" = "index.md" },
  { "ブラウザで試す" = "playground.md" },
]

# ---- Language switcher ----------------------------------------------------

[[project.extra.alternate]]
name = "English"
link = "/ritsu/"
lang = "en"

[[project.extra.alternate]]
name = "日本語"
link = "/ritsu/ja/"
lang = "ja"

[project.theme]
variant = "modern"
# Search, the copy button, previous / next and "edit this page" come from the theme's own
# Japanese pack; without this, the chrome stays English.
language = "ja"
icon.repo = "fontawesome/brands/github"
# navigation.footer     previous / next at the foot of every page
# navigation.top        a back-to-top button on long pages
# content.code.copy     a copy button on every code block
features = [
  "navigation.footer",
  "navigation.top",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "ダークモードにする"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "ライトモードにする"

# Unicode-preserving heading anchors, so that a Japanese heading gets the anchor GitHub gives it.
[project.markdown_extensions.toc]
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
