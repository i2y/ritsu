<svg xmlns="http://www.w3.org/2000/svg" class="flow" viewBox="0 0 683 112" width="683" role="img" aria-labelledby="flow-t"><title id="flow-t">返金 の勘定のあいだの流れ</title>
<style>
svg { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
.cb-bg { fill: #ffffff; }
svg { display: block; max-width: none; height: auto; }
svg text { fill: #1f2328; font-size: 13px; }
svg .name { font-weight: 600; font-size: 14px; }
svg .sub { fill: #59636e; }
.node rect { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.2; }
.node.outside rect { stroke: #59636e; stroke-dasharray: 5 3; }
.edge path { fill: none; stroke: #59636e; stroke-width: 1.5; }
.edge.pending path { stroke-dasharray: 6 4; }
.head { fill: #59636e; }
.head.ok { fill: #1a7f37; }
.head.no { fill: #cf222e; }
.label rect { fill: #ffffff; opacity: 0.92; }
.label text { font-size: 12px; }
.edge.lit path { stroke: #1a7f37; stroke-width: 3; }
.edge.no path { stroke: #cf222e; stroke-width: 3; }
.label.lit text { fill: #1a7f37; font-weight: 600; }
.label.no text { fill: #cf222e; font-weight: 600; }
</style>
<rect class="cb-bg" width="100%" height="100%" rx="8"/>
<defs><marker id="flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker><marker id="flow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head ok" d="M0 0 L10 5 L0 10 z"/></marker><marker id="flow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head no" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<g class="edge" data-k="0"><path d="M126 58 C191 58, 191 58, 256 58" marker-end="url(#flow-a)" data-a="url(#flow-a)" data-ok="url(#flow-ok)" data-no="url(#flow-no)"/></g>
<g class="edge pending" data-k="1"><path d="M427 58 C492 58, 492 58, 557 58" marker-end="url(#flow-a)" data-a="url(#flow-a)" data-ok="url(#flow-ok)" data-no="url(#flow-no)"/></g>
<g class="label" data-k="0"><rect x="161" y="49" width="59" height="16" rx="3"/><text x="191" y="61" text-anchor="middle">売上計上</text></g>
<g class="label" data-k="1"><rect x="475" y="49" width="34" height="16" rx="3"/><text x="492" y="61" text-anchor="middle">返金</text></g>
<g class="node" data-a="0"><rect x="256" y="24" width="172" height="68" rx="4"/><text x="342" y="44" text-anchor="middle" class="name">返金できる残り(注文)</text><text x="342" y="62" text-anchor="middle" class="sub">円</text><text x="342" y="80" text-anchor="middle" class="sub">0 以上（返金超過）</text></g>
<g class="node outside" data-a="1"><rect x="20" y="33" width="106" height="50" rx="16"/><text x="73" y="53" text-anchor="middle" class="name">売上</text><text x="73" y="71" text-anchor="middle" class="sub">円・外の勘定</text></g>
<g class="node outside" data-a="2"><rect x="557" y="33" width="106" height="50" rx="16"/><text x="610" y="53" text-anchor="middle" class="name">返金済み</text><text x="610" y="71" text-anchor="middle" class="sub">円・外の勘定</text></g>
</svg>
