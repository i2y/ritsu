[project]
site_name = "ritsu"
site_url = "https://i2y.github.io/ritsu/"
site_description = "Write the rules a system must follow in small languages, and check that every input gets exactly one answer and that no two rules disagree. From the checked rules, ritsu generates code, pages for people to read, and the inputs, answers and scenarios to test with."
site_author = "Yasushi Itoh"
copyright = "Copyright &copy; 2026 Yasushi Itoh"

# ritsu's own pages. Each language's site has a configuration of its own in a directory of its own
# (dandori/zensical.toml), and build.sh builds it there and puts it at build/<language>.
repo_url = "https://github.com/i2y/ritsu"
repo_name = "i2y/ritsu"
edit_uri = "edit/main/website/docs"

docs_dir = "docs"
site_dir = "build"
use_directory_urls = true

nav = [
  { Home = "index.md" },
  { "Try it in the browser" = "playground.md" },
  { rulec = "languages/rulec.md" },
  { dandori = "languages/dandori.md" },
  { koyomi = "languages/koyomi.md" },
  { chobo = "languages/chobo.md" },
  { geas = "languages/geas.md" },
  { yuen = "languages/yuen.md" },
  { sakai = "languages/sakai.md" },
  { sekisho = "sekisho.md" },
  { kaname = [
    { kaname = "kaname/index.md" },
    { "Writing kaname" = "kaname/language.md" },
    { "Four functional cores" = "kaname/examples.md" },
    { "What the check guarantees" = "kaname/checks.md" },
    { "Rules, dates and books" = "kaname/together.md" },
  ] },
  { "ritsu in Node" = "node.md" },
  { Modules = "modules.md" },
  { "Publishing libraries" = "libraries.md" },
]

# ---- Language switcher ----------------------------------------------------

[[project.extra.alternate]]
name = "English"
link = "/ritsu/"
lang = "en"

[[project.extra.alternate]]
name = "日本語"
link = "/ritsu/ja/"
lang = "ja"

[project.theme]
variant = "modern"
icon.repo = "fontawesome/brands/github"
# navigation.footer     previous / next at the foot of every page
# navigation.top        a back-to-top button on long pages
# content.code.copy     a copy button on every code block
# content.tabs.link     a tab chosen on a page (TypeScript, Python, Go) is chosen in every set of tabs
features = [
  "navigation.footer",
  "navigation.top",
  "content.code.copy",
  "content.tabs.link",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# Unicode-preserving heading anchors, so that a Japanese heading gets the anchor GitHub gives it.
[project.markdown_extensions.toc]
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

# Colour the code of the languages: ```kn with tools/knlexer.py, ```gate with tools/gatelexer.py,
# Cedar's ```cedar and ```cedarschema with tools/cedarlexer.py, and ```rule, ```flow and ```book with
# the lexers of rulec's, dandori's and chobo's sites. Naming a module here is how it gets imported,
# and importing it is what registers its lexers with Pygments; build.sh puts tools/ and the tools/ of
# the three sites on PYTHONPATH.
[project.markdown_extensions.knlexer]
[project.markdown_extensions.gatelexer]
[project.markdown_extensions.cedarlexer]
[project.markdown_extensions.rulelexer]
[project.markdown_extensions.flowlexer]
[project.markdown_extensions.booklexer]

[project.markdown_extensions.pymdownx.superfences]

# Tabs, one for each language a host of kaname's examples is written in.
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
