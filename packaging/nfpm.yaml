# The .deb and the .rpm of one release (DESIGN 13.2). packaging/linux.sh fills in the three
# variables from the static binary in the release archive. That binary needs no library, so the
# packages depend on nothing and install the same file the archive holds, with the same eight links
# beside it (/usr/bin/rulec -> ritsu, and so on), and the two licenses and THIRD_PARTY_NOTICES in
# /usr/share/doc/ritsu.
#
# The license is ritsu's (crates/ritsu/Cargo.toml): its own code, with the data rulec and koyomi
# hold; THIRD_PARTY_NOTICES gives those and the crates compiled in.
#
# ritsu holds the rulec command, so the packages replace the package rulec of the releases before
# ritsu: installing one over the other takes the old one away, and a package that depends on
# `rulec` is met by this one.
name: ritsu
arch: ${RITSU_ARCH}
platform: linux
version: ${RITSU_VERSION}
release: "1"
section: devel
priority: optional
maintainer: Yasushi Itoh <6240399+i2y@users.noreply.github.com>
homepage: https://github.com/i2y/ritsu
license: (MIT OR Apache-2.0) AND Unicode-3.0 AND BSD-3-Clause
description: |-
  Small languages for the rules a system must follow, checked so that every input gets exactly
  one answer and no two rules disagree:
  rulec, dandori, koyomi, chobo, geas, yuen, sakai and sekisho.
  From the checked rules, ritsu generates code, pages for people to read, and the inputs,
  answers and scenarios to test with. One static binary, no runtime and no dependencies; each
  language's command is a link to it.

replaces:
  - rulec
conflicts:
  - rulec
provides:
  - rulec

contents:
  - src: ${RITSU_BINARY}
    dst: /usr/bin/ritsu
    expand: true
    file_info:
      mode: 0755
  - src: ritsu
    dst: /usr/bin/rulec
    type: symlink
  - src: ritsu
    dst: /usr/bin/dandori
    type: symlink
  - src: ritsu
    dst: /usr/bin/koyomi
    type: symlink
  - src: ritsu
    dst: /usr/bin/chobo
    type: symlink
  - src: ritsu
    dst: /usr/bin/geas
    type: symlink
  - src: ritsu
    dst: /usr/bin/yuen
    type: symlink
  - src: ritsu
    dst: /usr/bin/sakai
    type: symlink
  - src: ritsu
    dst: /usr/bin/sekisho
    type: symlink
  - src: LICENSE-MIT
    dst: /usr/share/doc/ritsu/LICENSE-MIT
    file_info:
      mode: 0644
  - src: LICENSE-APACHE
    dst: /usr/share/doc/ritsu/LICENSE-APACHE
    file_info:
      mode: 0644
  - src: THIRD_PARTY_NOTICES
    dst: /usr/share/doc/ritsu/THIRD_PARTY_NOTICES
    file_info:
      mode: 0644
